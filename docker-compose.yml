services:
  pim-api:
    build:
      context: .
      dockerfile: src/Pim.Api/Dockerfile
    ports:
      - "127.0.0.1:5858:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000'"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - TZ=Asia/Shanghai
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=pim;Username=pim;Password=${PG_PASSWORD}
      - Kopia__RepositoryPath=/data/kopia-repo
      - Kopia__Password=${KOPIA_PASSWORD}
      - DataProtection__KeysPath=/data/data-protection
      - Tika__BaseUrl=${TIKA_BASE_URL:-}
      # 可选：Web Push VAPID（base64url 无填充）；留空时站内通知/SSE 正常，推送安全降级为 Skipped。
      - Notifications__WebPush__PublicKey=${PIM_WEBPUSH_PUBLIC_KEY:-}
      - Notifications__WebPush__PrivateKey=${PIM_WEBPUSH_PRIVATE_KEY:-}
      - Notifications__WebPush__Subject=${PIM_WEBPUSH_SUBJECT:-mailto:admin@example.invalid}
      - PIM_OPS_KEY=${PIM_OPS_KEY:-}
      # 日志最低级别；不设置时用配置里的 Logging:LogLevel:Default（Development 默认 Debug）
      - PIM_LOG_LEVEL=${PIM_LOG_LEVEL:-}
      - LOKI_URL=${LOKI_URL:-}
    volumes:
      - pim_data:/data
      - ./keys:/data/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pim-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/ops_token:/etc/prometheus/ops_token:ro
      - prometheus_data:/prometheus
    depends_on:
      - pim-api
    networks:
      - pim-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - pim-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - pim-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pim
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: pim
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pim"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pim-net



volumes:
  pg_data:
  pim_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  pim-net:
    driver: bridge
