services:
  pim-api:
    build:
      context: .
      dockerfile: src/Pim.Api/Dockerfile
    ports:
      - "127.0.0.1:5858:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000'"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - TZ=Asia/Shanghai
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=pim;Username=pim;Password=${PG_PASSWORD}
      - Kopia__RepositoryPath=/data/kopia-repo
      - Kopia__Password=${KOPIA_PASSWORD}
      - DataProtection__KeysPath=/data/data-protection
      - Tika__BaseUrl=${TIKA_BASE_URL:-}
      - Ai__Enabled=${AI_ENABLED:-false}
      - Ai__Provider=litellm
      - Ai__BaseUrl=http://litellm:4000
      - Ai__ApiKey=${PIM_LITELLM_VIRTUAL_KEY}
      - Ai__DefaultModel=${PIM_AI_DEFAULT_MODEL:-pim-default}
      - Ai__TimeoutSeconds=30
      - Ai__MaxOutputTokensPerRequest=1000
      - Ai__MaxAttemptsPerRequest=2
      - Ai__SaveFullPrompts=true
      - Ai__SaveFullResponses=true
      - PIM_OPS_KEY=${PIM_OPS_KEY:-}
      - LOKI_URL=${LOKI_URL:-}
    volumes:
      - pim_data:/data
      - ./keys:/data/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - pim-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/ops_token:/etc/prometheus/ops_token:ro
      - prometheus_data:/prometheus
    depends_on:
      - pim-api
    networks:
      - pim-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - pim-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - pim-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pim
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: pim
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pim"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pim-net


  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - DATABASE_URL=postgresql://pim:${PG_PASSWORD}@postgres:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - LITELLM_UPSTREAM_MODEL=${LITELLM_UPSTREAM_MODEL}
      - LITELLM_UPSTREAM_API_KEY=${LITELLM_UPSTREAM_API_KEY}
      - LITELLM_UPSTREAM_API_BASE=${LITELLM_UPSTREAM_API_BASE}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      litellm-db-init:
        condition: service_completed_successfully
    networks:
      - pim-net

  litellm-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      - PGPASSWORD=${PG_PASSWORD}
    command: >
      sh -c "psql -h postgres -U pim -d postgres -v ON_ERROR_STOP=1 -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'litellm'\"
      | grep -q 1
      || psql -h postgres -U pim -d postgres -v ON_ERROR_STOP=1 -c
      \"CREATE DATABASE litellm\""
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pim-net






volumes:
  pg_data:
  pim_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  pim-net:
    driver: bridge
