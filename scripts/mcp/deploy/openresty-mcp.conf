# PIM /mcp 反代片段（OpenResty / nginx，issue #178）
#
# 部署位置：
#   生产站点 pim.conf（端口 15858）的 server 块内。1panel 场景通常以
#   `include proxy/mcp.conf;` 引入，或直接贴入 conf.d 文件。
#
# ⚠️ 关键：本片段中的 `location = /mcp` 为精确匹配，nginx 优先级天然高于
#   `location ^~ /`（SPA 兜底），因此无需担心被兜底吞掉；但若采用前缀形式
#   （如 `location ^~ /mcp/`），必须放在 `location ^~ /` 之前，否则仍会落入
#   SPA 兜底（表现：GET /mcp 返回 index.html、POST /mcp 返回 405 allow GET,HEAD）。
#
# 生效：nginx -t && nginx -s reload（或 1panel 面板重载）。

# Streamable HTTP 端点：GET（SSE 事件流）+ POST（JSON-RPC）
# 协议端点即 /mcp（无子路径）；若客户端误带尾斜杠 /mcp/，先 301 归正，
# 否则会落入 `location ^~ /` SPA 兜底（GET 200 html / POST 405 allow GET,HEAD）。
location = /mcp/ {
    return 301 /mcp;
}

location = /mcp {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # MCP 会话事件流需要长连接且禁用缓冲，否则 SSE 消息被 nginx 攒批延迟
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    # 文件上传（QuickNotes/Files 工具）需要大 body，默认 1m 会 413
    client_max_body_size 50m;
    # 建议限制访问来源（仅放行可信 AI 客户端 IP 段）
    # allow 10.0.0.0/8;
    # deny all;
}