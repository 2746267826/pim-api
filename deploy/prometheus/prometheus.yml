global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pim-api
    metrics_path: /metrics
    scheme: http
    # API 容器在 compose 网络内的服务名；生产部署改为实际主机:端口
    targets:
      - api:5000
    # /metrics 需要鉴权：把 PIM_OPS_KEY 之一作为 Bearer 令牌
    # 本地文件方式，避免写进版本库：prometheus 启动前把密钥放进 /etc/prometheus/ops_token
    bearer_token_file: /etc/prometheus/ops_token
