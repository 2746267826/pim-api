global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pim-api
    metrics_path: /metrics
    scheme: http
    # 生产 compose 中 API 服务名为 pim；其他部署形态改为实际主机:端口
    targets:
      - pim:5000
    # /metrics 需要鉴权：把 .env.prod 中 PIM_OPS_KEY 之一写入 deploy/prometheus/ops_token
    bearer_token_file: /etc/prometheus/ops_token
