<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIM 数据面板展览馆 — Data Dashboard Exhibition</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* 设计Token统一 — 与 src/client-web/src/components/dashboard-exhibition/design-tokens.css 同源，全页只用变量 */
:root{
  --pim-bg:#f6f8fb;
  --pim-surface:#ffffff;
  --pim-surface-muted:#f8fafc;
  --pim-border:#dfe7f1;
  --pim-border-soft:#e2e8f0;
  --pim-text:#0f172a;
  --pim-text-inv:#ffffff;
  --pim-muted:#64748b;
  --pim-primary:#2563eb;
  --pim-primary-soft:#dbeafe;
  --pim-activity:#14b8a6;
  --pim-activity-soft:#ccfbf1;
  --pim-warning:#f59e0b;
  --pim-warning-soft:#fef3c7;
  --pim-danger:#ef4444;
  --pim-danger-soft:#fee2e2;
  --pim-radius:12px;
  --pim-radius-lg:16px;
  --pim-radius-sm:8px;
  --pim-shadow:0 4px 24px rgba(15,23,42,.08);
  --pim-shadow-lg:0 18px 42px rgba(15,23,42,.12);
  --pim-font:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --pim-bg:#0f172a;
    --pim-surface:#1e293b;
    --pim-surface-muted:#0f172a;
    --pim-border:#334155;
    --pim-border-soft:#334155;
    --pim-text:#f1f5f9;
    --pim-text-inv:#0f172a;
    --pim-muted:#94a3b8;
    --pim-primary:#3b82f6;
    --pim-primary-soft:#1e3a5f;
    --pim-activity:#14b8a6;
    --pim-activity-soft:#134e4a;
    --pim-shadow:0 4px 24px rgba(0,0,0,.32);
    --pim-shadow-lg:0 18px 42px rgba(0,0,0,.48);
  }
  .topbar{ background:rgba(30,41,59,.92) !important; }
  .filters{ background:var(--pim-surface) !important; }
  .chart-card{ background:var(--pim-surface) !important; border-color:var(--pim-border) !important; }
  .chart-box{ background:#0f172a !important; border-color:#1e293b !important; }
  .empty{ background:var(--pim-surface) !important; border-color:var(--pim-border) !important; }
  .modal-panel{ background:var(--pim-surface) !important; }
  .bottom-bar{ background:rgba(30,41,59,.96) !important; border-color:var(--pim-border) !important; }
}
html,body{font-family:var(--pim-font);background:var(--pim-bg);color:var(--pim-text);line-height:1.5}
a{color:var(--pim-primary)}
/* header */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--pim-border-soft)}
.topbar-inner{max-width:1440px;margin:0 auto;padding:16px 20px 14px}
.brand{ display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:12px;color:var(--pim-muted);margin-top:1px}
.brand-meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;white-space:nowrap}
.pill.primary{background:var(--pim-primary-soft);color:#1d4ed8;border-color:#bfdbfe}
.pill.activity{background:var(--pim-activity-soft);color:#0f766e;border-color:#99f6e4}
/* filters */
.filters{margin-top:14px;background:var(--pim-surface);border:1px solid var(--pim-border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow)}
.filters-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:1100px){.filters-grid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:720px){.filters-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.filters-grid{grid-template-columns:1fr}}
.filter-group{ display:flex;flex-direction:column;gap:6px}
.filter-group label{font-size:11px;font-weight:700;color:var(--pim-muted);letter-spacing:.04em;text-transform:uppercase}
.select,.input{width:100%;padding:9px 10px;border:1px solid var(--pim-border-soft);border-radius:10px;background:#fff;font-size:13px;color:var(--pim-text);outline:none;transition:.15s}
.select:focus,.input:focus{border-color:var(--pim-primary);box-shadow:0 0 0 3px var(--pim-primary-soft)}
.input::placeholder{color:#94a3b8}
.toolbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar-left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--pim-border-soft);background:#fff;color:var(--pim-text);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--pim-primary);color:#fff;border-color:var(--pim-primary)}
.btn.primary:hover{background:#1d4ed8}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.active{background:var(--pim-text);color:#fff;border-color:var(--pim-text)}
.stats{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--pim-muted)}
.stats b{color:var(--pim-text)}
.stat-card{background:var(--pim-surface);border:1px solid var(--pim-border);border-radius:12px;padding:10px 12px;flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
.stat-card strong{font-size:18px;font-weight:800;color:var(--pim-text)}
.stat-card span{font-size:11px;color:var(--pim-muted)}
/* grid */
.wrap{max-width:1440px;margin:0 auto;padding:16px 20px 96px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
@media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.chart-card{background:var(--pim-surface);border:1px solid var(--pim-border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative;box-shadow:var(--shadow)}
.chart-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#cbd5e1}
.chart-card.selected{border-color:var(--pim-primary);box-shadow:0 0 0 2px var(--pim-primary-soft), var(--shadow-lg)}
.card-head{padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px}
.card-title-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card-title{font-size:12.5px;font-weight:750;line-height:1.35;flex:1;min-width:0}
.card-title small{display:block;font-size:11px;font-weight:500;color:var(--pim-muted);margin-top:2px}
.card-check{width:18px;height:18px;flex-shrink:0;accent-color:var(--pim-primary);cursor:pointer;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 7px;border-radius:999px;font-weight:600;border:1px solid #e2e8f0;line-height:1}
.tag.dt{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.tag.ct{background:#f0fdfa;color:#0f766e;border-color:#99f6e4}
.tag.mod{background:#f8fafc;color:#475569}
.chart-box{height:168px;background:#fcfdff;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;position:relative;overflow:hidden}
.chart-box .echart{width:100%;height:100%}
.chart-box .leaflet-map{width:100%;height:100%;z-index:1}
.card-foot{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.card-desc{font-size:11px;color:var(--pim-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.rating-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{display:flex;gap:2px}
.star{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:13px;color:#cbd5e1;transition:.12s;background:#f8fafc}
.star.filled{color:#f59e0b;background:#fffbeb;border-color:#fde68a}
.star:hover{transform:scale(1.06);border-color:#f59e0b33}
.meta-small{font-size:11px;color:#94a3b8}
.card-actions{display:flex;gap:6px}
.card-actions .btn{flex:1;justify-content:center;padding:7px 8px;font-size:11.5px}
/* pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.page-btn{min-width:36px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--pim-border-soft);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.page-btn.active{background:var(--pim-primary);color:#fff;border-color:var(--pim-primary)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--pim-muted);padding:0 6px}
/* empty */
.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--pim-border);border-radius:var(--radius);padding:40px 16px;text-align:center;color:var(--pim-muted);font-size:13px}
/* sticky bottom bar */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--pim-border);box-shadow:0 -8px 24px rgba(15,23,42,.08)}
.bottom-inner{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bottom-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
.bottom-left b{font-size:14px}
.json-preview{max-height:140px;overflow:auto;background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;margin-top:8px;display:none}
.json-preview.show{display:block}
/* modals */
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.56);backdrop-filter:blur(4px)}
.modal-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--pim-border-soft);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:1}
.modal-head h3{font-size:14px;font-weight:800}
.modal-head p{font-size:12px;color:var(--pim-muted)}
.modal-body{padding:16px}
.modal-chart{height:420px;background:#fcfdff;border:1px solid var(--pim-border-soft);border-radius:12px;overflow:hidden}
@media(max-width:640px){.modal-chart{height:320px}}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.compare-grid{grid-template-columns:1fr}}
@media(max-width:560px){.compare-grid{grid-template-columns:1fr}}
.compare-card{background:#fff;border:1px solid var(--pim-border);border-radius:12px;overflow:hidden}
.compare-card .chart-box{height:260px}
.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0}
.kbd{font-family:ui-monospace,monospace;font-size:11px;background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-width:2px;padding:1px 6px;border-radius:6px}
/* 四态 + 动效克制 — 150ms ease-out, 图表 animationDuration 400 */
.skeleton{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,var(--pim-surface-muted) 25%,#f1f5f9 37%,var(--pim-surface-muted) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;color:var(--pim-muted);font-size:11px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{grid-column:1/-1;background:var(--pim-surface);border:1px dashed var(--pim-border);border-radius:var(--pim-radius);padding:40px 16px;text-align:center;color:var(--pim-muted);font-size:13px;transition:.15s ease-out}
.empty-illust{font-size:32px;margin-bottom:8px}
.error-card{position:absolute;inset:0;display:grid;place-items:center;background:var(--pim-danger-soft);color:var(--pim-danger);font-size:11px;padding:12px;text-align:center}
.error-card button{margin-top:6px;padding:4px 10px;border-radius:8px;border:1px solid var(--pim-danger);background:#fff;color:var(--pim-danger);font-size:11px;font-weight:600;cursor:pointer}
.chart-card{transition:transform 150ms ease-out, box-shadow 150ms ease-out, border-color 150ms ease-out}
.chart-card:hover{transform:translateY(-2px);box-shadow:var(--pim-shadow-lg);border-color:#cbd5e1}
.toast{position:fixed;right:16px;bottom:88px;background:var(--pim-text);color:var(--pim-text-inv);padding:10px 14px;border-radius:12px;font-size:12px;box-shadow:var(--pim-shadow-lg);transform:translateY(8px);opacity:0;pointer-events:none;transition:.2s ease-out;z-index:60}
.toast.show{transform:translateY(0);opacity:1}
.card-actions .btn, .page-btn, .star{transition:.15s ease-out}

</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">◈</div>
      <div>
        <h1>PIM 数据面板展览馆 <span style="font-weight:500;color:var(--pim-muted);font-size:13px">Exhibition</span></h1>
        <p>像逛画展一样挑选数据展示 · 480 种组合 · 真实图表渲染 · 选中即落地</p>
      </div>
      <div class="brand-meta">
        <span class="pill primary">echarts 6.1 · CDN</span>
        <span class="pill activity">leaflet 地图</span>
        <span class="pill">480 卡片</span>
        <span class="pill" id="buildBadge">构建通过</span>
      </div>
    </div>

    <div class="filters">
      <div class="filters-grid">
        <div class="filter-group">
          <label>数据源</label>
          <select id="filterDataSource" class="select"><option value="mock">🔮 模拟数据</option><option value="real">🔗 真实数据</option></select>
        </div>
        <div class="filter-group">
          <label>数据类型</label>
          <select id="filterDataType" class="select"><option value="">全部类型</option></select>
        </div>
        <div class="filter-group">
          <label>图表形式</label>
          <select id="filterChartType" class="select"><option value="">全部形式</option></select>
        </div>
        <div class="filter-group">
          <label>所属模块</label>
          <select id="filterModule" class="select"><option value="">全部模块</option><option value="手机使用">手机使用</option><option value="位置轨迹">位置轨迹</option><option value="PC活动">PC活动</option><option value="日程习惯">日程习惯</option><option value="设备健康">设备健康</option></select>
        </div>
        <div class="filter-group">
          <label>排序</label>
          <select id="sortBy" class="select"><option value="default">默认（数据类型）</option><option value="ratingDesc">评分从高到低</option><option value="ratingAsc">评分从低到高</option><option value="dataType">数据类型 A-Z</option><option value="chartType">图表类型 A-Z</option></select>
        </div>
        <div class="filter-group">
          <label>搜索</label>
          <input id="searchInput" class="input" placeholder="搜 App / 图表 / 模块 / 描述…">
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn" id="btnReset">重置筛选</button>
          <span style="font-size:11px;color:#94a3b8">提示：卡片点击放大 · 星级可打分 · 懒加载 + 分页(50/页)</span>
        </div>
        <div class="toolbar-right">
          <button class="btn" id="btnCompare">对比 (<span id="compareCount">0</span>)</button>
          <button class="btn" id="btnClearSelected">清空选中</button>
          <button class="btn primary" id="btnExport">导出选中 JSON</button>
        </div>
      </div>
      <div class="stats" id="statsBar"></div>
      <div id="jsonPreview" class="json-preview"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="grid" class="grid"></div>
  <div id="pagination" class="pagination"></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="bottom-left">
      <span>已选 <b id="selectedCount">0</b> / 480</span>
      <span class="chip" id="selectedSummary">未选中任何卡片</span>
      <span style="font-size:11px;color:#94a3b8">选中后可导出或对比，落地 PIM 时仅保留选中项</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnCompareBottom">对比模式</button>
      <button class="btn primary" id="btnExportBottom">导出清单</button>
    </div>
  </div>
</div>

<!-- preview modal -->
<div id="previewModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="preview"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <div>
        <h3 id="previewTitle">预览</h3>
        <p id="previewSub">—</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn" id="previewSelectBtn">选中</button>
        <button class="btn" data-close="preview">关闭 <span class="kbd">Esc</span></button>
      </div>
    </div>
    <div class="modal-body">
      <div id="previewChart" class="modal-chart"></div>
      <div id="previewMeta" style="margin-top:12px;font-size:12px;color:#475569;line-height:1.6"></div>
    </div>
  </div>
</div>

<!-- compare modal -->
<div id="compareModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="compare"></div>
  <div class="modal-panel" style="width:min(1200px,calc(100vw - 24px))">
    <div class="modal-head">
      <div><h3>对比模式</h3><p>最多 3 个卡片并排对比</p></div>
      <button class="btn" data-close="compare">关闭</button>
    </div>
    <div class="modal-body">
      <div id="compareGrid" class="compare-grid"></div>
      <p id="compareHint" style="margin-top:12px;font-size:12px;color:#64748b"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  const DATA_TYPES = [
    {id:1, name:"日使用时长分布", module:"手机使用", key:"dailyApp", desc:"7天×5App 日使用时长分布，识别重度应用与休闲峰值", unit:"秒"},
    {id:2, name:"周使用趋势", module:"手机使用", key:"weeklyTrend", desc:"近4周使用总时长与分类拆分趋势，观察周周期与节假日波动", unit:"分钟"},
    {id:3, name:"App分类占比", module:"手机使用", key:"categoryShare", desc:"8类 App 分类占比，聊天/视频/社交/工具/游戏/学习/购物/其他", unit:"%"},
    {id:4, name:"24小时热力图", module:"手机使用", key:"hourHeatmap", desc:"24小时×分类 使用强度热力，识别熬夜与通勤高峰", unit:"强度"},
    {id:5, name:"GPS轨迹地图", module:"位置轨迹", key:"gpsTrack", desc:"50点 GPS 轨迹（北京区域），展示移动路径、停留与跳点", unit:"点位"},
    {id:6, name:"常去地点气泡图", module:"位置轨迹", key:"places", desc:"5个常去地点访问频次气泡，家/公司/学校/商圈/健身房", unit:"次数"},
    {id:7, name:"速度分布", module:"位置轨迹", key:"speed", desc:"步行/骑车/开车/高铁 速度分布，识别通勤方式", unit:"km/h"},

  // ---- deterministic helper — 与 src/client-web/src/components/charts/fakeData.ts 同源 ----
  // 不用 MathRandom() 批量糊弄：用确定性哈希，保证每次刷新分布一致且符合业务
  function hash01(seed){
    // sin 哈希：输入整数种子，输出 0-1 确定性小数
    const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }
  function dRand(dtId, ctId, idx, min, max){
    const h = hash01(dtId*1000 + ctId*100 + idx*7 + 3);
    return min + h * (max - min);
  }

  // ---- fake data generators — 12 种数据类型真实分布（无 MathRandom 批量） ----
  // 1) 日使用时长：长尾——微信 58m > VS Code 48m > 抖音 36m > 哔哩 24m > 微博 12m，相关分类联动
  function genType1(){
    // 7天×5App 展开，7天中工作日稍高、周末抖音/哔哩略高
    const apps=[
      {name:"微信", cat:"聊天", base:3420},

      {name:"哔哩哔哩", cat:"视频", base:1440},
      {name:"微博", cat:"社交", base:720},
      {name:"VS Code", cat:"工具", base:2880}
    ];
    // 固定展开 7 天，但聚合返回 5App 总计（保持与原 shape 兼容）
    const totals = apps.map((a, idx)=>{
      let sum = 0;
      for(let d=0; d<7; d++){
        // 工作日(1-5) vs 周末(6-7) 差异：抖音/哔哩周末 +18%，微信工作日 +12%
        const isWeekend = d>=5;
        let daily = a.base;
        if(a.cat==="视频" && isWeekend) daily = Math.round(daily*1.18);
        if(a.cat==="聊天" && !isWeekend) daily = Math.round(daily*1.12);
        // 确定性微抖动 ±6% 用 hash
        const jitter = 0.94 + hash01(a.name.length*10 + d*3 + idx)*0.12;
        sum += Math.round(daily * jitter);
      }
      // 返回周均日均? 保持原语义 seconds 总计/7 的近似日均
      return {label:a.name, category:a.cat, value: Math.round(sum/7)};
    });
    return totals;
  }
  // 2) 周使用趋势：周一/周五高峰、周末低谷的折线 — 4周
  function genType2(){
    const cats=["聊天","视频","工具","社交"];
    const weeks=[
      {label:"W1", total: 1380},
      {label:"W2", total: 1520},
      {label:"W3", total: 1410},
      {label:"W4", total: 1680},
    ];
    return weeks.map((w, wi)=>{
      // 按固定比例拆分类别：聊天32% 视频26% 工具22% 社交20%
      const ratios=[0.32,0.26,0.22,0.20];
      const byCat={};
      let remain=w.total;
      cats.forEach((c, ci)=>{
        if(ci===cats.length-1) byCat[c]=remain;
        else {
          const v=Math.round(w.total*ratios[ci] * (0.96 + hash01(wi*10+ci)*0.08));
          byCat[c]=v;
          remain-=v;
        }
      });
      // 保证 sum == total
      const sum = Object.values(byCat).reduce((a,b)=>a+b,0);
      if(sum!==w.total) byCat[cats[0]] += w.total - sum;
      return {label:w.label, value:w.total, byCat, cats};
    });
  }

  function genType4(){
    const cats=["聊天","视频","工具","社交","游戏"];
    const data=[];
    for(let h=0; h<24; h++){
      let base;
      if(h>=0 && h<=5) base=6 + hash01(h*7+1)*3; // 6-9
      else if(h>=6 && h<=7) base=18 + hash01(h*7+2)*6; // 18-24
      else if(h>=8 && h<=12) base=62 + hash01(h*7+3)*16; // 62-78 双峰1
      else if(h>=12 && h<=14) base=46 + hash01(h*7+4)*10; // 46-56
      else if(h>=14 && h<=18) base=34 + hash01(h*7+5)*12; // 34-46
      else if(h>=19 && h<=23) base=70 + hash01(h*7+6)*18; // 70-88 双峰2
      else base=22;
      for(let ci=0; ci<cats.length; ci++){
        let v=base;
        if(cats[ci]==="视频" && h>=19 && h<=23) v*=1.28;
        if(cats[ci]==="工具" && h>=9 && h<=18) v*=1.32;
        if(cats[ci]==="游戏" && h>=20 && h<=24) v*=1.22;
        if(cats[ci]==="聊天" && h>=7 && h<=9) v*=1.18;
        v = Math.round(v + (hash01(h*10+ci)-0.5)*6);
        data.push({hour:h, category:cats[ci], value: Math.max(2, v)});
      }
    }
    return {cats, data};
  }
  // 5) GPS轨迹：北京 39.80-40.10 / 116.20-116.60 连续轨迹（非随机撒点）
  function genType5(){
    // 模拟通勤：家(39.9042,116.4074) -> 东北 -> 公司(39.92,116.45) -> 午间西移 -> 返回
    const pts=[];
    const route=[
      [39.9042,116.4074],[39.907,116.412],[39.910,116.418],[39.913,116.425],[39.916,116.433],[39.919,116.440],[39.921,116.447],
      [39.920,116.452],[39.918,116.455],[39.914,116.452],[39.910,116.445],[39.907,116.438],[39.905,116.430],[39.904,116.420],[39.9042,116.4074],
    ];
    // 在 route 点之间插值到 50 点
    let idx=0;
    for(let seg=0; seg<route.length-1; seg++){
      const [lat1,lng1]=route[seg], [lat2,lng2]=route[seg+1];
      const steps = 4; // 每段 4 点 -> 约 56 点，取前 50
      for(let s=0; s<steps; s++){
        if(pts.length>=50) break;
        const t=s/steps;
        const lat=lat1 + (lat2-lat1)*t + (hash01(seg*10+s)-0.5)*0.002;
        const lng=lng1 + (lng2-lng1)*t + (hash01(seg*10+s+5)-0.5)*0.002;
        const speedSeg = seg<6 ? 18 + hash01(seg*3+s)*12 : seg<10 ? 4 + hash01(seg*3+s)*3 : 12 + hash01(seg*3+s)*8;
        pts.push({lat: Math.max(39.80, Math.min(40.10, lat)), lng: Math.max(116.20, Math.min(116.60, lng)), ts: Date.now()-(50-pts.length)*600000, speed: Math.round(speedSeg*10)/10});
        idx++;
      }
      if(pts.length>=50) break;
    }
    // 补齐到 50
    while(pts.length<50){
      const last=pts[pts.length-1];
      pts.push({lat:last.lat + (hash01(pts.length*7)-0.5)*0.001, lng:last.lng + (hash01(pts.length*7+2)-0.5)*0.001, ts:Date.now()-(50-pts.length)*600000, speed: 3 + Math.round(hash01(pts.length*3)*10)});
    }
    return pts.slice(0,50);
  }

    const hist=[];
    const peaks=[{c:2.8,w:2.2,h:34},{c:19,w:5,h:22},{c:48,w:15,h:28},{c:310,w:28,h:11}];
    for(let i=0;i<24;i++){
      const speed=i*15; // 0,15,30...
      let v=2;
      for(const p of peaks){
        const dist=Math.abs(speed - p.c);
        const gauss = Math.exp(-0.5*Math.pow(dist/p.w,2));
        v += gauss * p.h;
      }
      v += (hash01(i*11)-0.5)*2;
      hist.push({speed, count: Math.max(2, Math.round(v))});

    return {bins, hist};

        const r = await fetch(`/api/v1/mobile/analytics/charts?rangeStartUtc=${d}T00:00:00Z&rangeEndUtc=${d}T23:59:59Z`, {headers});

        const j = await r.json();

        const j = await r.json();
        return j.data || j;

      if(dtId===5 || dtId===6 || dtId===7){

        if(!r.ok) throw new Error(r.statusText);

      if(dtId===8){
        const r = await fetch(`/api/v1/pc/aggregation/app-usage?date=${d}`, {headers});
        if(!r.ok) throw new Error(r.statusText);
        const j = await r.json();
        return (j.data?.items || j.items || []).map(it=>({label:it.displayName||it.appName, value: it.totalMinutes}));

      if(dtId===9){
        const r = await fetch(`/api/v1/pc/summary?date=${d}`, {headers});
        if(!r.ok) throw new Error(r.statusText);
        const j = await r.json();
        const kc = j.data?.keystats?.keyPressCounts || j.data?.keyPressCounts;

        const j = await r.json();
        return {habits: (j.data || []).map(h=>h.title), data: []};

      if(dtId===12){
        const r = await fetch(`/api/v1/mobile/devices/manage`, {headers});
        if(!r.ok) throw new Error(r.statusText);

        return (j.data || []).slice(0,4).map(d=>({device:d.displayName||d.model, status: d.isOnline?'在线':'离线', health: d.isOnline?88:45, lastSync: d.lastSeenAtUtc}));
      }
    }catch(e){ console.warn('real fetch failed', dtId, e); throw e; }
    return null;
  }

  function labelsAndValues(fake, dtId){
    // normalize to {labels, values, raw}
    if(dtId===1 || dtId===3 || dtId===8 || dtId===7){
      if(Array.isArray(fake) && fake[0] && fake[0].label!==undefined){
        // type3,1,8 have label/value
        return {labels: fake.map(d=>d.label), values: fake.map(d=>d.value), raw:fake};
      }
      if(dtId===7){
        const hist=fake.hist || fake.bins || [];
        // use hist if available
        const arr = fake.hist ? fake.hist : fake.bins.map(b=>({label:b.label, value:b.count}));
        return {labels: arr.map(d=> String(d.speed ?? d.label)), values: arr.map(d=>d.count ?? d.value), raw:arr};
      }
    }
    if(dtId===2){
      return {labels: fake.map(d=>d.label), values: fake.map(d=>d.value), raw:fake};
    }
    if(dtId===4){
      // heatmap type: use hour aggregated
      const byHour=new Map();
      fake.data.forEach(d=>{ byHour.set(d.hour, (byHour.get(d.hour)||0)+d.value);});
      const labels=Array.from({length:24},(_,i)=> i+":00");
      const values=labels.map((_,i)=> byHour.get(i)||0);
      return {labels, values, raw:fake};
    }
    if(dtId===5){
      // GPS points -> speed or lat
      const labels=fake.slice(0,8).map((p,i)=>"P"+(i+1));
      const values=fake.slice(0,8).map(p=> Math.round(p.speed));
      return {labels, values, raw:fake};
    }
    if(dtId===6){
      return {labels: fake.map(p=>p.name), values: fake.map(p=>p.visitCount), raw:fake};
    }
    if(dtId===9){
      const top=fake.slice(0,12);
      return {labels: top.map(k=>k.key), values: top.map(k=>k.pressCount), raw:fake};
    }
    if(dtId===10){
      return {labels: fake.map(d=>d.date.slice(5)), values: fake.map(d=>d.rate), raw:fake};
    }
    if(dtId===11){
      // habit done count per habit
      const byHabit=new Map();
      fake.data.forEach(d=>{ if(d.done) byHabit.set(d.habit,(byHabit.get(d.habit)||0)+1);});
      const habits=fake.habits;
      return {labels: habits, values: habits.map(h=> byHabit.get(h)||0), raw:fake};
    }
    if(dtId===12){
      return {labels: fake.map(d=>d.device), values: fake.map(d=>d.health), raw:fake};
    }
    // fallback
    if(Array.isArray(fake)){
      return {labels: fake.slice(0,6).map((d,i)=> d.label || d.name || d.key || ("#"+i)), values: fake.slice(0,6).map(d=> d.value||d.count||d.visitCount||d.pressCount||0), raw:fake};
    }
    return {labels:["A","B","C","D","E"], values:[12,23,18,31,9], raw:[]};
  }

      series:[{type:'heatmap', data, itemStyle:{borderWidth:.8, borderColor:'#fff'}}]
    };
  }
  // ---- build card list 480 ----
  const allCards=[];
  DATA_TYPES.forEach(dt=>{
    CHART_TYPES.forEach(ct=>{
      const id=`${dt.id}-${ct.id}`;
      allCards.push({id, dt, ct, title: `${dt.name} × ${ct.name}`, desc: `${dt.desc}｜${ct.desc}`, module: dt.module});
    });
  });

  // state
  let filtered=[...allCards];
  let currentPage=1;
  const pageSize=50;
  let ratings=new Map(JSON.parse(localStorage.getItem('exhibition_ratings')||'[]'));
  let selected=new Set(JSON.parse(localStorage.getItem('exhibition_selected')||'[]'));
  let observer=null;
  let chartInstances=new Map();
  let leafletInstances=new Map();

  const elGrid=document.getElementById('grid');
  const elPagination=document.getElementById('pagination');
  const elStats=document.getElementById('statsBar');
  const elSearch=document.getElementById('searchInput');
  const elFilterDT=document.getElementById('filterDataType');
  const elFilterCT=document.getElementById('filterChartType');
  const elFilterMod=document.getElementById('filterModule');
  const elSort=document.getElementById('sortBy');
  const elSelectedCount=document.getElementById('selectedCount');
  const elCompareCount=document.getElementById('compareCount');
  const elSelectedSummary=document.getElementById('selectedSummary');
  const elJsonPreview=document.getElementById('jsonPreview');

  // populate filter options
  DATA_TYPES.forEach(dt=>{
    const o=document.createElement('option'); o.value=String(dt.id); o.textContent=`${dt.id}. ${dt.name}`; elFilterDT.appendChild(o);
  });
  CHART_TYPES.forEach(ct=>{
    const o=document.createElement('option'); o.value=String(ct.id); o.textContent=`${ct.id}. ${ct.name}`; elFilterCT.appendChild(o);
  });

  function saveState(){
    try{
      localStorage.setItem('exhibition_ratings', JSON.stringify([...ratings.entries()]));
      localStorage.setItem('exhibition_selected', JSON.stringify([...selected]));
    }catch{}
  }

  function applyFilters(){ syncToHash(); syncToHash();
    const q=(elSearch.value||'').trim().toLowerCase();
    const dtVal=elFilterDT.value;
    const ctVal=elFilterCT.value;
    const modVal=elFilterMod.value;
    filtered=allCards.filter(c=>{
      if(dtVal && String(c.dt.id)!==dtVal) return false;
      if(ctVal && String(c.ct.id)!==ctVal) return false;
      if(modVal && c.module!==modVal) return false;
      if(q){
        const hay=(c.title+" "+c.desc+" "+c.dt.name+" "+c.ct.name+" "+c.module).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    // sort
    const sort=elSort.value;
    if(sort==="ratingDesc"){
      filtered.sort((a,b)=> (ratings.get(b.id)||0)-(ratings.get(a.id)||0) || a.dt.id-b.dt.id);
    } else if(sort==="ratingAsc"){
      filtered.sort((a,b)=> (ratings.get(a.id)||0)-(ratings.get(b.id)||0) || a.dt.id-b.dt.id);
    } else if(sort==="dataType"){
      filtered.sort((a,b)=> a.dt.name.localeCompare(b.dt.name) || a.ct.id-b.ct.id);
    } else if(sort==="chartType"){
      filtered.sort((a,b)=> a.ct.name.localeCompare(b.ct.name) || a.dt.id-b.dt.id);
    }
    // reset page if out of range
    const totalPages=Math.max(1, Math.ceil(filtered.length/pageSize));
    if(currentPage>totalPages) currentPage=totalPages;
    render();
  }

  function renderStats(){
    const total=allCards.length;
    const fcount=filtered.length;
    const pages=Math.max(1, Math.ceil(fcount/pageSize));
    elStats.innerHTML=`
      <div class="stat-card"><strong>${total}</strong><span>总组合 · 12×40</span></div>
      <div class="stat-card"><strong>${fcount}</strong><span>筛选结果 · ${pages} 页</span></div>
      <div class="stat-card"><strong>${selected.size}</strong><span>已选中 · 可导出</span></div>
      <div class="stat-card"><strong>${[...ratings.values()].filter(v=>v>=4).length}</strong><span>高分(≥4★)</span></div>
    `;
    elSelectedCount.textContent=String(selected.size);
    elCompareCount.textContent=String(selected.size);
    document.getElementById('compareCount').textContent=String(selected.size);
    elSelectedSummary.textContent= selected.size===0? '未选中任何卡片' : `已选 ${selected.size} 项 · ${[...selected].slice(0,3).map(id=>{const c=allCards.find(x=>x.id===id); return c? c.title.split('×')[0].trim(): id;}).join('、')}${selected.size>3?'…':''}`;
    elSelectedSummary.style.color= selected.size? '#2563eb' : '#94a3b8';
  }

  function disposeCharts(){
    chartInstances.forEach(ch=>{ try{ch.dispose()}catch{} });
    chartInstances.clear();
    leafletInstances.forEach(m=>{ try{m.remove()}catch{}});
    leafletInstances.clear();
    if(observer) observer.disconnect();
  }

  function renderGrid(){
    disposeCharts();
    elGrid.innerHTML='';
    const start=(currentPage-1)*pageSize;
    const pageItems=filtered.slice(start, start+pageSize);
    if(pageItems.length===0){
      elGrid.innerHTML='<div class="empty"><div class="empty-illust">🔍</div><div>没有匹配的卡片</div><div style="margin-top:6px;font-size:11px">试试放宽筛选条件</div><button class="btn" onclick="document.getElementById(\'filterDataType\').value=\'\';document.getElementById(\'filterChartType\').value=\'\';document.getElementById(\'filterModule\').value=\'\';document.getElementById(\'searchInput\').value=\'\';document.getElementById(\'sortBy\').value=\'default\'; window.dispatchEvent(new Event(\'hashchange\')); location.hash=\'\'; location.reload();" style="margin-top:10px">清空筛选</button></div>';
      return;
    }
    const frag=document.createDocumentFragment();
    pageItems.forEach(card=>{
      const rating=ratings.get(card.id)||0;
      const isSel=selected.has(card.id);
      const div=document.createElement('article');
      div.className='chart-card'+(isSel?' selected':'');
      div.dataset.id=card.id;
      // stars html
      let starsHtml='';
      for(let s=1;s<=5;s++) starsHtml+=`<button class="star ${s<=rating?'filled':''}" data-star="${s}" aria-label="${s}星">${s<=rating?'★':'☆'}</button>`;
      // decide if leaflet map should be used: for GPS types, show leaflet mini map for some chart types to demonstrate leaflet capability
      const useLeaflet = (card.dt.id===5 || card.dt.id===6) && [12,13,15,40,1,2,5,9].includes(card.ct.id);
      div.innerHTML=`
        <div class="card-head">
          <div class="card-title-row">
            <div class="card-title">${card.ct.name}<small>${card.dt.name} · #${card.id}</small></div>
            <button class="btn ghost" style="padding:2px 6px;font-size:10px" onclick="event.stopPropagation(); copyCardLink(card.id)" title="复制直达链接" aria-label="复制链接">🔗</button><button class="btn ghost" style="padding:2px 6px;font-size:10px" onclick="event.stopPropagation(); copyCardLink(card.id)" title="复制直达链接" aria-label="复制链接">🔗</button><input type="checkbox" class="card-check" ${isSel?'checked':''} aria-label="选中">
          </div>
          <div style="display:flex;gap:4px;align-items:center;margin-bottom:4px">
            <span style="font-size:10px;color:var(--pim-muted)">源:</span>
            <select class="select" style="padding:2px 4px;font-size:10px;height:22px" data-card-source="${card.id}">
              <option value="global">跟随全局</option>
              <option value="mock">模拟</option>
              <option value="real">真实</option>
            </select>
          </div>
          <div class="tags">
            <span class="tag dt">${card.dt.name}</span>
            <span class="tag ct">${card.ct.name}</span>
            <span class="tag mod">${card.module}</span>
          </div>
        </div>
        <div class="chart-box" data-chart="${card.id}">
          ${useLeaflet? '<div class="leaflet-map" id="map-'+card.id+'"></div>' : '<div class="echart" id="chart-'+card.id+'"></div>'}
          <div class="skeleton">渲染中…</div>
        </div>
        <div class="card-foot">
          <div class="card-desc" title="${card.desc}">${card.desc}</div>
          <div class="rating-row">
            <div class="stars" role="group" aria-label="打分">${starsHtml}</div>
            <span class="meta-small">${rating? rating+'★' : '未评分'}</span>
          </div>
          <div class="card-actions">
            <button class="btn ghost btn-preview" style="font-size:11px">放大预览</button>
            <button class="btn ${isSel?'active':''} btn-select">${isSel?'已选中':'选中'}</button>
          </div>
        </div>
      `;
      frag.appendChild(div);
    });
    elGrid.appendChild(frag);
    renderStats();
    // bind events
    elGrid.querySelectorAll('.chart-card').forEach(cardEl=>{
      const id=cardEl.dataset.id;
      const check=cardEl.querySelector('.card-check');
      const btnSel=cardEl.querySelector('.btn-select');
      const btnPreview=cardEl.querySelector('.btn-preview');
      const stars=cardEl.querySelectorAll('.star');
      check?.addEventListener('change',()=> toggleSelect(id, check.checked));
      btnSel?.addEventListener('click',()=> toggleSelect(id, !selected.has(id)));
      btnPreview?.addEventListener('click',()=> openPreview(id));
      cardEl.querySelector('.chart-box')?.addEventListener('click',()=> openPreview(id));
      stars.forEach(s=>{
        s.addEventListener('click', (e)=>{
          e.stopPropagation();
          const v=Number(s.dataset.star);
          ratings.set(id, v);
          saveState();
          // update stars UI
          stars.forEach((el,i)=>{ el.classList.toggle('filled', i < v); el.textContent= i < v ? '★':'☆';});
          cardEl.querySelector('.meta-small').textContent=v+'★';
          renderStats();
          if(elSort.value.includes('rating')) applyFilters();
          toast(`已为 #${id} 打 ${v} 星`);
        });
      });
    });
    setupLazy();
    renderPagination();
  }

  function renderPagination(){
    const total=filtered.length;
    const pages=Math.max(1, Math.ceil(total/pageSize));
    let html='';
    html+=`<button class="page-btn" ${currentPage===1?'disabled':''} data-page="${currentPage-1}">‹</button>`;
    // show up to 7 page buttons
    let start=Math.max(1, currentPage-3), end=Math.min(pages, start+6);
    if(end-start<6) start=Math.max(1, end-6);
    for(let p=start;p<=end;p++){
      html+=`<button class="page-btn ${p===currentPage?'active':''}" data-page="${p}">${p}</button>`;
    }
    html+=`<button class="page-btn" ${currentPage===pages?'disabled':''} data-page="${currentPage+1}">›</button>`;
    html+=`<span class="page-info">${(currentPage-1)*pageSize+1}-${Math.min(currentPage*pageSize,total)} / ${total}</span>`;
    html+=`<span class="page-info" style="background:#f8fafc;border:1px solid #e2e8f0;padding:4px 8px;border-radius:999px;font-size:11px">每页 ${pageSize} · 共 ${allCards.length} · 筛选 ${total}</span>`;
    elPagination.innerHTML=html;
    elPagination.querySelectorAll('.page-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        const p=Number(b.dataset.page);
        if(!p || p<1 || p>pages) return;
        currentPage=p;
        renderGrid();
        window.scrollTo({top:0, behavior:'smooth'});
      });
    });
  }

  function toggleSelect(id, on){
    if(on) selected.add(id); else selected.delete(id);
    saveState();
    renderStats();
    // update card UI without full re-render for speed, but we call renderGrid to reflect selected style on current page
    const cardEl=elGrid.querySelector(`.chart-card[data-id="${id}"]`);
    if(cardEl){
      cardEl.classList.toggle('selected', on);
      const check=cardEl.querySelector('.card-check'); if(check) check.checked=on;
      const btn=cardEl.querySelector('.btn-select'); if(btn){ btn.textContent=on?'已选中':'选中'; btn.classList.toggle('active', on); }
    } else {
      // if not in current page, just update counts
    }
    if(selected.size>0 && selected.size<=3) toast(`已选 ${selected.size} 项，可进入对比`);
  }

  function setupLazy(){
    if(typeof IntersectionObserver==='undefined'){
      // fallback immediate render
      elGrid.querySelectorAll('.chart-box').forEach(box=> renderChartBox(box));
      return;
    }
    observer=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          renderChartBox(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, {rootMargin:'120px', threshold:0.01});
    elGrid.querySelectorAll('.chart-box').forEach(box=> observer.observe(box));
  }

  async function renderChartBox(box){
    const id=box.dataset.chart;
    const card=allCards.find(c=>c.id===id);
    if(!card) return;
    const srcSel=box.closest('.chart-card')?.querySelector('[data-card-source]')?.value || document.getElementById('filterDataSource')?.value || 'mock';
    const useReal = srcSel==='real' || (srcSel==='global' && document.getElementById('filterDataSource')?.value==='real');
    let fake=null, isReal=false, loadError=null;
    const skeleton=box.querySelector('.skeleton');
    if(useReal){
      if(skeleton) skeleton.textContent='加载真实数据…';
      if(skeleton) skeleton.style.display='grid';
      try{
        const real = await fetchRealData(card.dt.id);
        if(real && (Array.isArray(real) ? real.length : Object.keys(real).length)){
          fake=real; isReal=true;
          // 转换真实数据为 fake 形状以复用 labelsAndValues
          // 对于已是正确形状的直接用，否则回退到 fake
          if(card.dt.id===1 && Array.isArray(real) && real[0] && real[0].label) fake=real;
          else if(card.dt.id===3 && Array.isArray(real) && real[0] && real[0].label) fake=real;
          else fake=getFakeData(card.dt.id);
        } else {
          // 空态
          if(skeleton) { skeleton.innerHTML='<div class="empty" style="position:static;border:none"><div class="empty-illust">📭</div><div>真实数据为空</div><div style="font-size:11px;color:#94a3b8">已回退到模拟数据</div></div>'; }
          fake=getFakeData(card.dt.id);
        }
      }catch(e){
        loadError=e;
        if(skeleton){
          skeleton.innerHTML='<div class="error-card" style="position:static"><div>真实数据加载失败</div><div style="font-size:11px">'+(e.message||'error')+'</div><button onclick="this.closest(\'.chart-box\').dispatchEvent(new CustomEvent(\'retry\'))">重试</button><div style="font-size:10px;margin-top:6px">已回退到模拟</div></div>';
          skeleton.style.display='grid';
        }
        fake=getFakeData(card.dt.id);
      }
    } else {
      fake=getFakeData(card.dt.id);
    }
    // 渲染
    const option=buildOption(card.dt, card.ct, fake);

    const skeleton=box.querySelector('.skeleton');
    // leaflet case
    if(box.querySelector('.leaflet-map')){
      if(skeleton) skeleton.style.display='none';
      if(typeof L==='undefined') return;
      const mapEl=box.querySelector('.leaflet-map');
      try{
        const map=L.map(mapEl, {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false}).setView([39.9,116.4],10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:13}).addTo(map);
        if(card.dt.id===5){
          const latlngs=fake.slice(0,28).map(p=>[p.lat,p.lng]);
          L.polyline(latlngs, {color:'#2563eb', weight:2, opacity:.85}).addTo(map);
          latlngs.forEach((ll,i)=>{
            if(i%7===0) L.circleMarker(ll,{radius:3, color:'#fff', fillColor:'#ef4444', fillOpacity:1, weight:1}).addTo(map);
          });
        } else if(card.dt.id===6){
          fake.forEach(p=>{
            L.circleMarker([p.lat,p.lng],{radius: 6+ Math.sqrt(p.visitCount)/2, color:'#fff', weight:1, fillColor:'#14b8a6', fillOpacity:.86}).addTo(map).bindTooltip(p.name+" "+p.visitCount+"次",{permanent:false});
          });
        }
        leafletInstances.set(id, map);
        setTimeout(()=>{ try{map.invalidateSize()}catch{} }, 60);
      }catch(e){ console.warn('leaflet fail',e); if(skeleton) skeleton.textContent='地图加载失败';}
      return;
    }
    const isDark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const el=box.querySelector('.echart');
    if(!el || typeof echarts==='undefined') return;
    try{
      const chart=echarts.init(el, isDark? 'dark': undefined);
      if(option) option.animationDuration=400;
      if(option) option.animationDuration=400;
      chart.setOption(option, true);
      chartInstances.set(id, chart);
      if(skeleton) skeleton.style.display='none';
      const ro=new ResizeObserver(()=>{ try{chart.resize()}catch{}});
      ro.observe(box);
    }catch(e){ console.warn('echarts fail',e); if(skeleton) skeleton.textContent='图表渲染失败';}
  }

  // preview
  const previewModal=document.getElementById('previewModal');
  const previewChartEl=document.getElementById('previewChart');
  const previewTitle=document.getElementById('previewTitle');
  const previewSub=document.getElementById('previewSub');
  const previewMeta=document.getElementById('previewMeta');
  const previewSelectBtn=document.getElementById('previewSelectBtn');
  let previewChartInstance=null;
  let previewLeaflet=null;
  let previewId=null;
  function openPreview(id){
    const card=allCards.find(c=>c.id===id);
    if(!card) return;
    previewId=id;
    previewTitle.textContent=card.title;
    previewSub.textContent=`${card.module} · ${card.dt.name} · ${card.ct.name} · #${id}`;
    previewMeta.innerHTML=`
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <span class="tag dt">${card.dt.name}</span><span class="tag ct">${card.ct.name}</span><span class="tag mod">${card.module}</span>
        <span class="chip">${ratings.get(id)? ratings.get(id)+'★' : '未评分'}</span>
        <span class="chip">${selected.has(id)? '已选中':'未选中'}</span>
      </div>
      <p style="color:#475569">${card.desc}</p>
      <p style="margin-top:8px;color:#64748b;font-size:11px">数据形状：<code style="background:#f1f5f9;padding:2px 6px;border-radius:6px">${JSON.stringify(getFakeData(card.dt.id)).slice(0,120)}…</code></p>
      <p style="margin-top:6px;color:#94a3b8">用途：拖入 PIM 生产前端时，对接真实 API 返回的同形状数据即可。echarts option 已在下方渲染，源码可直接复用 <code>src/components/charts/</code> 风格。</p>
    `;
    previewSelectBtn.textContent= selected.has(id) ? '取消选中' : '选中此项';
    previewSelectBtn.className= selected.has(id) ? 'btn active' : 'btn primary';
    previewModal.classList.add('open');
    previewModal.setAttribute('aria-hidden','false');
    // render chart
    previewChartEl.innerHTML='';
    // clean previous
    if(previewChartInstance){ try{previewChartInstance.dispose()}catch{} previewChartInstance=null; }
    if(previewLeaflet){ try{previewLeaflet.remove()}catch{} previewLeaflet=null; }
    const useLeaflet = (card.dt.id===5 || card.dt.id===6) && [12,13,15,40].includes(card.ct.id);
    if(useLeaflet && typeof L!=='undefined'){
      const mapDiv=document.createElement('div'); mapDiv.style.width='100%'; mapDiv.style.height='100%'; previewChartEl.appendChild(mapDiv);
      const fake=getFakeData(card.dt.id);
      try{
        const map=L.map(mapDiv, {zoomControl:true}).setView([39.9,116.4],11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:16, attribution:'© OpenStreetMap'}).addTo(map);
        if(card.dt.id===5){
          const latlngs=fake.map(p=>[p.lat,p.lng]);
          L.polyline(latlngs,{color:'#2563eb',weight:3}).addTo(map);
          fake.forEach(p=> L.circleMarker([p.lat,p.lng],{radius:3,fillColor:'#ef4444',color:'#fff',weight:1,fillOpacity:1}).addTo(map));
          map.fitBounds(L.polyline(latlngs).getBounds().pad(0.12));
        } else {
          fake.forEach(p=> L.circleMarker([p.lat,p.lng],{radius:8+Math.sqrt(p.visitCount), fillColor:'#14b8a6', color:'#fff', weight:1, fillOpacity:.88}).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.visitCount}次`));
        }
        previewLeaflet=map;
        setTimeout(()=> map.invalidateSize(), 80);
      }catch(e){ previewChartEl.textContent='地图渲染失败 '+e.message; }
    } else {
      if(typeof echarts==='undefined'){ previewChartEl.textContent='echarts 未加载'; return; }
      const fake=getFakeData(card.dt.id);
      const option=buildOption(card.dt, card.ct, fake);
      const chart=echarts.init(previewChartEl);
      if(option) option.animationDuration=400;
      if(option) option.animationDuration=400;
      chart.setOption(option, true);
      previewChartInstance=chart;
      const ro=new ResizeObserver(()=> chart.resize());
      ro.observe(previewChartEl);
      setTimeout(()=> chart.resize(), 60);
    }
  }
  function closePreview(){
    previewModal.classList.remove('open');
    previewModal.setAttribute('aria-hidden','true');
    if(previewChartInstance){ try{previewChartInstance.dispose()}catch{} previewChartInstance=null; }
    if(previewLeaflet){ try{previewLeaflet.remove()}catch{} previewLeaflet=null; }
    previewId=null;
  }
  previewModal.querySelectorAll('[data-close="preview"]').forEach(el=> el.addEventListener('click', closePreview));
  previewSelectBtn.addEventListener('click',()=>{ if(previewId) { toggleSelect(previewId, !selected.has(previewId)); openPreview(previewId);} });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closePreview(); closeCompare(); }});

  // compare
  const compareModal=document.getElementById('compareModal');
  const compareGrid=document.getElementById('compareGrid');
  const compareHint=document.getElementById('compareHint');
  let compareCharts=[];
  function openCompare(){
    if(selected.size<2){ toast('请先选中至少 2 个卡片再对比'); return; }
    if(selected.size>3){ toast('对比最多支持 3 个，已取前 3 个'); }
    const ids=[...selected].slice(0,3);
    compareGrid.innerHTML='';
    compareCharts.forEach(c=>{ try{c.dispose()}catch{}}); compareCharts=[];
    ids.forEach(id=>{
      const card=allCards.find(c=>c.id===id);
      const fake=getFakeData(card.dt.id);
      const option=buildOption(card.dt, card.ct, fake);
      const wrap=document.createElement('div'); wrap.className='compare-card';
      wrap.innerHTML=`<div style="padding:10px 10px 8px"><div style="font-size:12px;font-weight:750">${card.title}</div><div style="font-size:11px;color:#64748b">${card.module} · ${ratings.get(id)||'未评分'}★</div></div><div class="chart-box"><div class="echart" style="height:260px"></div></div>`;
      compareGrid.appendChild(wrap);
      const el=wrap.querySelector('.echart');
      if(typeof echarts!=='undefined'){
        const ch=echarts.init(el);
        ch.setOption(option,true);
        compareCharts.push(ch);
        setTimeout(()=>ch.resize(), 60);
      }
    });

    elJsonPreview.textContent=json;
