services:
  pim:
    image: ghcr.io/2746267826/pim-api-server:${PIM_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # 公网入口只由宿主机反向代理提供；API 端口仅绑定回环地址。
      - "127.0.0.1:${PIM_HTTP_PORT:-5858}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # 反代必须在本机 / pim-net 内，并且发出的 X-Forwarded-Proto 才会被信任。
      # 现有 1Panel OpenResty 如从宿主机转发，请把其实际来源 IP/CIDR 加进 PIM_TRUSTED_PROXIES。
      - PIM_TRUSTED_PROXIES=${PIM_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.31.240.0/24}
      # 跨域浏览器来源只能是 HTTPS；同源部署无需配置。留空时仅保留本机开发来源。
      - PIM_CORS_ORIGINS=${PIM_CORS_ORIGINS:-}
      - TZ=Asia/Shanghai
      - ConnectionStrings__DefaultConnection=${PG_CONNECTION}
      - Jwt__PrivateKeyPath=/data/keys/jwt_private.pem
      - DataProtection__KeysPath=/data/keys/data-protection
      - Kopia__RepositoryPath=/data/kopia-repo
      - Kopia__Password=${KOPIA_PASSWORD}
      - Tika__BaseUrl=${TIKA_BASE_URL:-}
      - Files__OneDrive__Tenant=${FILES_ONEDRIVE_TENANT:-consumers}
      - Files__SensitivePathPatterns__0=/Secrets/*
      - Files__SensitivePathPatterns__1=/Passwords/*
      - Files__MaxInlineTextBytes=1048576
      - PIM_OPS_KEY=${PIM_OPS_KEY}
      - PIM_OPS_RO_CONNECTION=${PIM_OPS_RO_CONNECTION}
      # 日志最低级别（Trace/Debug/Information/Warning/Error/Fatal）；不设置时用配置里的
      # Logging:LogLevel:Default，再退回 Information。改这一项即可降噪，无需改代码。
      - PIM_LOG_LEVEL=${PIM_LOG_LEVEL:-Information}
      - PIM_LOG_RETAINED_FILES=${PIM_LOG_RETAINED_FILES:-2}
      - PIM_LOG_FILE_SIZE_LIMIT_BYTES=${PIM_LOG_FILE_SIZE_LIMIT_BYTES:-}
      - PIM_LOG_ROLL_ON_FILE_SIZE_LIMIT=${PIM_LOG_ROLL_ON_FILE_SIZE_LIMIT:-}
      - LOKI_URL=${LOKI_URL:-}
    volumes:
      - pim_data:/data
      - /data/pim/logs:/data/pim/logs
      # 最小权限挂载：JWT 私钥文件按只读提供；DataProtection 密钥目录按可写提供（主密钥轮换需要写入）。
      # 两条宿主机路径都必须在首次启动前预置：私钥缺失会让健康检查持续失败；数据保护密钥目录缺失时容器
      # 仍会通过健康检查，并就地生成新的 key-*.xml —— 旧密钥环保护的密文将解不开（健康检查看不出来）。
      - /data/keys/jwt_private.pem:/data/keys/jwt_private.pem:ro
      - /data/keys/data-protection:/data/keys/data-protection
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q healthy <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pim-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/ops_token:/etc/prometheus/ops_token:ro
      - prometheus_data:/prometheus
    depends_on:
      - pim
    networks:
      - pim-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - pim-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - pim-net

volumes:
  pim_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  pim-net:
    driver: bridge
    ipam:
      config:
        # 固定网段让 PIM_TRUSTED_PROXIES 的默认容器网络边界可复现。
        - subnet: 172.31.240.0/24
