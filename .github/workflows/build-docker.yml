name: Build Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
      is_release:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      # ci.yml 的 web-build job 记录的构建时间；与 web-version.json 同源。
      web_built_at:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: false
        default: ''
        type: string
      artifact_slug:
        required: false
        default: ''
        type: string
      git_sha_short:
        required: false
        default: ''
        type: string
      is_release:
        required: false
        default: 'false'
        type: string
      assembly_version:
        required: false
        default: ''
        type: string
      web_built_at:
        required: false
        default: ''
        type: string

env:
  IMAGE: ghcr.io/2746267826/pim-api-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
            echo "is_release=${{ inputs.is_release }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Resolve web build time
        id: webtime
        run: |
          BUILT_AT="${{ inputs.web_built_at }}"
          if [ -z "$BUILT_AT" ]; then
            BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Pim.Api/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=pim-server
          cache-to: type=gha,mode=max,scope=pim-server
          build-args: |
            PIM_VERSION=${{ steps.ver.outputs.version }}
            ASSEMBLY_VERSION=${{ steps.ver.outputs.assembly_version }}
            PIM_WEB_VERSION=${{ steps.ver.outputs.version }}
            PIM_WEB_SHA=${{ steps.ver.outputs.git_sha_short }}
            PIM_WEB_BUILT_AT=${{ steps.webtime.outputs.built_at }}

      # 镜像内容校验：Dockerfile 里已硬失败，这里再把结果打出来做证据（含三个 label）。
      - name: Verify embedded frontend and labels
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}"
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            test -s /app/wwwroot/index.html
            test -s /app/wwwroot/web-version.json
            test -d /app/wwwroot/assets
            echo "wwwroot:"; ls /app/wwwroot
            echo "assets 文件数: $(find /app/wwwroot/assets -type f | wc -l)"
            echo "web-version.json: $(cat /app/wwwroot/web-version.json)"
          '
          echo "镜像 labels:"
          docker inspect --format '{{json .Config.Labels}}' "$IMG" | python3 -m json.tool
          API_LABEL="$(docker inspect --format '{{ index .Config.Labels "org.pim.api-version" }}' "$IMG")"
          WEB_LABEL="$(docker inspect --format '{{ index .Config.Labels "org.pim.web-version" }}' "$IMG")"
          SHA_LABEL="$(docker inspect --format '{{ index .Config.Labels "org.pim.web-sha" }}' "$IMG")"
          test "$WEB_LABEL" = "${{ steps.ver.outputs.version }}"
          test "$SHA_LABEL" = "${{ steps.ver.outputs.git_sha_short }}"
          test "$API_LABEL" = "${{ steps.ver.outputs.version }}"
          echo "labels 与本次注入值一致：api=$API_LABEL web=$WEB_LABEL sha=$SHA_LABEL"

          # metadata 一致性：镜像内 web-version.json 必须与本次注入的 version/sha/builtAt 同源，
          # 不能只信 label（label 可能对、文件却是别的构建）。
          docker run --rm --entrypoint sh "$IMG" -c 'cat /app/wwwroot/web-version.json' > /tmp/image-web-version.json
          FILE_WEB_VERSION="$(jq -r '.version' /tmp/image-web-version.json)"
          FILE_WEB_SHA="$(jq -r '.gitSha' /tmp/image-web-version.json)"
          FILE_WEB_BUILT_AT="$(jq -r '.builtAt' /tmp/image-web-version.json)"
          test "$FILE_WEB_VERSION" = "${{ steps.ver.outputs.version }}"
          test "$FILE_WEB_SHA" = "${{ steps.ver.outputs.git_sha_short }}"
          test "$FILE_WEB_BUILT_AT" = "${{ steps.webtime.outputs.built_at }}"
          echo "web-version.json 与注入值一致：version=$FILE_WEB_VERSION sha=$FILE_WEB_SHA builtAt=$FILE_WEB_BUILT_AT"

      - name: Smoke test
        run: |
          # 冒烟测试只验证镜像能起进程、响应 /health，并且真的在同源伺服 SPA。
          # 这条 job 里没有数据库。生产默认是"迁移失败即非零退出"（避免以半套 schema
          # 提供服务），因此这里显式声明例外：Database__Migrations__FailFast=false。
          IMG="${{ env.IMAGE }}:latest"
          CID="$(docker run -d --rm -e ASPNETCORE_URLS=http://+:5000 -e ASPNETCORE_ENVIRONMENT=Development -e Database__Migrations__FailFast=false "$IMG")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            if docker exec "$CID" bash -c \
              'exec 3<>/dev/tcp/localhost/5000; printf "GET /health HTTP/1.0\r\n\r\n" >&3; grep -q healthy <&3' 2>/dev/null; then
              echo "smoke: /health OK"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "smoke: /health FAILED — container logs:"
              docker logs "$CID" 2>&1 | tail -n 100 || true
              docker ps -a --filter "id=$CID" || true
              exit 1
            fi
            sleep 2
          done
          # 同源伺服 SPA：GET / 返回的正文必须与镜像里那份 index.html **逐字节一致**
          # （只查 200 + doctype 证明不了"伺服的是镜像里那一份"）。
          docker exec "$CID" sh -c 'cat /app/wwwroot/index.html' > /tmp/image-index.html
          docker exec "$CID" bash -c \
            'exec 3<>/dev/tcp/localhost/5000; printf "GET / HTTP/1.0\r\n\r\n" >&3; cat <&3' > /tmp/spa-response.txt
          head -c 120 /tmp/spa-response.txt; echo
          grep -q "200 OK" /tmp/spa-response.txt
          # 去掉响应头（HTTP 头与正文之间是一个空行）
          awk 'BEGIN{body=0} body{print} /^\r?$/{body=1}' /tmp/spa-response.txt > /tmp/spa-body.html
          if ! cmp -s /tmp/spa-body.html /tmp/image-index.html; then
            echo "::error::GET / 返回的正文与镜像内 /app/wwwroot/index.html 不一致（大小：$(wc -c < /tmp/spa-body.html) vs $(wc -c < /tmp/image-index.html)）"
            exit 1
          fi
          echo "smoke: SPA / OK（返回的正文与镜像内 index.html 逐字节一致，$(wc -c < /tmp/image-index.html) 字节）"

      # 台账（REQ-7）：从**烘焙好的镜像**里读 wwwroot/web-version.json 原样转录，
      # 再加产物镜像的 tag/digest 与本次 API 版本。不重新计算前端字段。
      # 每次都跑（PR 也跑）：台账的"从烘焙好的镜像原样转录 + 与镜像内文件逐字一致"
      # 这条逻辑必须每次构建都被真实执行到，不能只在发版时才第一次跑。
      # 只有"上传为 release 资产"是发版专属（见下面 Upload release ledger）。
      - name: Build release ledger (pim-web-version.json) and verify it
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/build-web-ledger.sh" \
            --api-image "${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}" \
            --api-version "${{ steps.ver.outputs.version }}" \
            --out pim-web-version.json
          echo "台账内容："; cat pim-web-version.json
          # 台账的前端三字段必须与镜像内文件逐字一致（同一来源，这里再做一次机器校验）
          LEDGER_JSON="$(jq -S '{version,gitSha,builtAt}' pim-web-version.json)"
          IMAGE_JSON="$(docker run --rm --entrypoint sh "${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}" \
            -c 'cat /app/wwwroot/web-version.json' | jq -S '{version,gitSha,builtAt}')"
          test "$LEDGER_JSON" = "$IMAGE_JSON" || {
            echo "错误：台账与镜像内 web-version.json 的三字段不一致" >&2
            echo "ledger=$LEDGER_JSON" >&2
            echo "image =$IMAGE_JSON" >&2
            exit 1
          }
          echo "✅ 台账前端三字段与镜像内 web-version.json 逐字一致"

      - name: Login to GHCR
        if: steps.ver.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: steps.ver.outputs.is_release == 'true'
        run: |
          docker push "${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Export image tarball
        if: steps.ver.outputs.is_release == 'true'
        run: |
          set -o pipefail
          mkdir -p build/artifacts
          docker save "${{ env.IMAGE }}:v${{ steps.ver.outputs.artifact_slug }}" \
            | gzip > "build/artifacts/pim-api-server-v${{ steps.ver.outputs.artifact_slug }}.tar.gz"
          TARBALL="build/artifacts/pim-api-server-v${{ steps.ver.outputs.artifact_slug }}.tar.gz"
          test -s "$TARBALL" || { echo "错误: docker save 产物为空: $TARBALL" >&2; exit 1; }
          echo "Artifact size: $(du -sh "$TARBALL" | cut -f1)"

      - name: Upload docker artifact
        if: steps.ver.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pim-api-server-v${{ steps.ver.outputs.artifact_slug }}
          path: build/artifacts/pim-api-server-*.tar.gz

      - name: Upload release ledger
        if: steps.ver.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pim-web-version-v${{ steps.ver.outputs.artifact_slug }}
          path: pim-web-version.json
          if-no-files-found: error
