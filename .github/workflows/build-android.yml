name: Build Android APK

on:
  push:
    branches: [master, codex/schedule-task-complete-system]
    paths:
      - 'src/client-android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/client-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client-android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate version string
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER:-1}
          VERSION_CODE=$((100000 + BUILD_NUMBER))
          VERSION_NAME="0.1.${BUILD_NUMBER}+${SHORT_SHA}"
          VERSION_FILE="0.1.${BUILD_NUMBER}-${SHORT_SHA}"
          ARTIFACT_NAME="pim-android-v${VERSION_FILE}-vc${VERSION_CODE}"
          echo "value=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME"
          echo "VERSION_DISPLAY=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_FILE=$VERSION_FILE" >> "$GITHUB_ENV"
          echo "CI_APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "CI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Generate gradlew wrapper
        run: |
          # Generate wrapper from temp dir (with minimal settings.gradle to placate Gradle 9)
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          touch settings.gradle
          gradle wrapper --gradle-version 8.14
          # Copy wrapper files into the project
          cp gradlew gradlew.bat "$OLDPWD/"
          mkdir -p "$OLDPWD/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$OLDPWD/gradle/wrapper/"
          chmod +x "$OLDPWD/gradlew"
          rm -rf "$TMPDIR"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build/artifacts/pim-android-v${VERSION_FILE}-vc${VERSION_CODE}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: src/client-android/build/artifacts/*.apk
