name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'src/client-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate gradlew wrapper (Gradle 8.5)
        run: |
          # Generate wrapper from temp dir (with minimal settings.gradle to placate Gradle 9)
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          touch settings.gradle
          gradle wrapper --gradle-version 8.5
          # Copy wrapper files into the project
          cp gradlew gradlew.bat "$OLDPWD/"
          mkdir -p "$OLDPWD/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$OLDPWD/gradle/wrapper/"
          chmod +x "$OLDPWD/gradlew"
          rm -rf "$TMPDIR"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pim-android-apk
          path: src/client-android/app/build/outputs/apk/debug/*.apk
