name: Build API

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    # 真库用例需要一个可用的 PostgreSQL。这里用 GitHub 托管的临时实例：
    # 随本次运行创建、结束后销毁，不接触任何真实环境，也不需要任何外部凭据。
    # 注意：TempMigrationDatabase 会自行建库/删库，要求 CREATEDB 权限
    #（官方镜像中 POSTGRES_USER 即超级用户，满足该前提）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pim_ci
          POSTGRES_PASSWORD: pim_ci_temporary
          POSTGRES_DB: pim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 指向本次运行的一次性实例；凭据仅对该临时容器有效，非任何真实环境凭据。
      # RealDbTestConnection 只读这个变量：不可达时用例显式 Skip，其余异常必须失败。
      PIM_TEST_CONN: "Host=127.0.0.1;Port=5432;Database=pim_ci;Username=pim_ci;Password=pim_ci_temporary"

    steps:
      # 防回归：test-shard 用 `| tee` 记录日志，必须取 PIPESTATUS[0] 才是 dotnet test 的退出码。
      # 写成 RC=$? 会拿到 tee 的 0，测试失败被吞、job 报 success（2026-11-26 实际发生：
      # shard-5 有 4 个用例失败却显示 success）。
      - name: Guard - exit-code plumbing works
        run: |
          set +e
          ( exit 7 ) | tee /dev/null > /dev/null
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 7 ]; then
            echo "::error::PIPESTATUS plumbing broken (got $RC, expected 7): shard failures would be swallowed as success"
            exit 1
          fi
          echo "exit-code plumbing OK - dotnet test failures will fail the shard"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64

      # 真库用例假定目标库具备完整 schema，而 schema 由两部分组成：
      #   1) EF 迁移链（建基础结构）
      #   2) 运行时模块初始化器（PcTrackerSchemaInitializer 等以幂等 SQL 维护的列/索引——
      #      迁移注释明确这 12 个对象的唯一所有者是运行时，迁移链不包含它们）
      # 只做 1) 会让真库用例在查询这些列时失败（42703 column does not exist），
      # 因此这里两步都跑：先迁移，再启动一次 API 触发运行时初始化器。
      - name: Initialize database schema (migrations + runtime initializers)
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 8.0.11 >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          echo "==> 1/2 迁移链"
          dotnet ef database update \
            --project src/Pim.Infrastructure/Pim.Infrastructure.csproj \
            --startup-project src/Pim.Api/Pim.Api.csproj \
            --connection "$PIM_TEST_CONN"

          echo "==> 2/2 启动 API 触发运行时模块初始化器"
          openssl genrsa -out "$RUNNER_TEMP/jwt.pem" 2048
          export ConnectionStrings__DefaultConnection="$PIM_TEST_CONN"
          export Jwt__PrivateKeyPath="$RUNNER_TEMP/jwt.pem"
          export DataProtection__KeysPath="$RUNNER_TEMP/dp_keys"
          export PIM_OPS_KEY=ci-temporary-ops-key
          export PIM_OPS_RO_CONNECTION="$PIM_TEST_CONN"
          export ASPNETCORE_ENVIRONMENT=Test
          export ASPNETCORE_URLS=http://127.0.0.1:5999

          # --no-restore：避免覆盖上一步带 --runtime linux-x64 生成的 assets
          #（否则后续 "Publish --runtime linux-x64" 会报 NETSDK1047）
          dotnet run --project src/Pim.Api --no-launch-profile --no-restore > "$RUNNER_TEMP/api-init.log" 2>&1 &
          API_PID=$!
          READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5999/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          # 顺便导出客户端契约（Test 环境映射了 Swagger 文档端点）
          if [ "$READY" = "1" ]; then
            if curl -sf http://127.0.0.1:5999/swagger/v1/swagger.json -o "$RUNNER_TEMP/openapi.raw.json"; then
              # 规范化：Swashbuckle 输出的键顺序不稳定，不排序会导致校验永远失败
              jq -S . "$RUNNER_TEMP/openapi.raw.json" > "$RUNNER_TEMP/openapi.generated.json"
              echo "已导出契约：$(wc -c < "$RUNNER_TEMP/openapi.generated.json") 字节"
            else
              echo "::error::未能从运行中的实例导出 /swagger/v1/swagger.json"
              exit 1
            fi
          fi
          kill "$API_PID" 2>/dev/null || true
          wait "$API_PID" 2>/dev/null || true
          # dotnet run 会再派生实际的应用进程；一并结束，避免残留进程占用构建输出
          pkill -f "Pim.Api" 2>/dev/null || true
          sleep 2
          if [ "$READY" != "1" ]; then
            echo "::error::API 未在 120s 内就绪，运行时 schema 初始化可能未完成"
            tail -50 "$RUNNER_TEMP/api-init.log"
            exit 1
          fi
          echo "schema 初始化完成（迁移链 + 运行时初始化器）"
          # 保险：确认带 RID 的 assets 仍然可用
          dotnet restore Pim.sln --runtime linux-x64

      # 用 Swashbuckle 官方 CLI 从程序集直接生成文档：不需要起服务、不猜端点路径。
      # 契约必须与代码同步：客户端仓按 contract/openapi.json 生成类型，
      # 过期会让前端拿到错的接口形状，所以这里硬校验。
      - name: Verify client contract is up to date
        shell: bash
        run: |
          set -uo pipefail
          GEN="$RUNNER_TEMP/openapi.generated.json"
          if [ ! -s "$GEN" ]; then
            echo "::error::未生成契约文件，无法校验"
            exit 1
          fi
          mkdir -p contract
          if [ -f contract/openapi.json ] && diff -q contract/openapi.json "$GEN" >/dev/null 2>&1; then
            echo "✅ contract/openapi.json 与当前代码一致"
          else
            cp "$GEN" contract/openapi.json.generated
            echo "::error::contract/openapi.json 与当前代码不一致；最新契约已作为 artifact 上传，下载后覆盖提交即可。"
            exit 1
          fi

      - name: Upload generated contract (stale)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-generated
          path: contract/openapi.json.generated
          if-no-files-found: ignore
          retention-days: 7

      # 测试已迁出到 test-shard-* job（见文件末尾）。
      # 拆分依据：TRX 实测显示 Api 目录 391 个 E2E 用例占 74% 耗时（2949s/总计 3982s），
      # 单 job 串行跑全量需 21-27 分钟；拆 6 片并行后墙钟降到约 11-15 分钟。
      # 分片完整性已验证：6 片合计 6658 用例 = baseline 6658，零漏测、零重复。
      - name: Publish API (linux-x64, framework-dependent)
        run: |
          dotnet publish src/Pim.Api/Pim.Api.csproj \
            --configuration Release \
            --no-restore \
            --runtime linux-x64 \
            -o publish/ \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -p:Version=${{ steps.ver.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Stage publish output
        run: |
          mkdir -p build/artifacts
          ARTIFACT="pim-api-v${{ steps.ver.outputs.artifact_slug }}"
          cd publish
          tar czf "../build/artifacts/${ARTIFACT}.tar.gz" .
          echo "Artifact size: $(du -sh ../build/artifacts/${ARTIFACT}.tar.gz | cut -f1)"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-api-v${{ steps.ver.outputs.artifact_slug }}
          path: build/artifacts/*.tar.gz

  # ── test-shard：6 个并行分片，跑完整测试套件 ──
  # 分片依据（TRX 实测，baseline 6658 个用例 / 3982 秒累加耗时）：
  #   Api 目录 391 个用例占 74%（2949s）——全是启动 Kestrel + 真库的 E2E
  #   Harness 2377 个用例只占 0.8%（30s）；Calendar 932 个占 0.7%（28s）
  # 因此把 Api 的慢类单独成片、其余目录合并；最慢片由 PcKeystatsUploadValidationE2ETests 决定（约 9 分钟）。
  # 已验证：6 片合计 6658 = baseline 6658（Failed/Skipped 也逐项一致），零漏测零重复。
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 与 build job 相同的一次性 PostgreSQL；每片独立建库并初始化 schema
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pim_ci
          POSTGRES_PASSWORD: pim_ci_temporary
          POSTGRES_DB: pim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PIM_TEST_CONN: "Host=127.0.0.1;Port=5432;Database=pim_ci;Username=pim_ci;Password=pim_ci_temporary"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard-1
            desc: 'Api: PcKeystatsUploadValidationE2ETests（最慢单类，决定墙钟下限）'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PcKeystatsUploadValidationE2ETests'
          - name: shard-2
            desc: 'Api: PublicRegistrationGate + AuthPasswordChange + AdminCreateUser'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PublicRegistrationGateE2ETests|FullyQualifiedName~Pim.UnitTests.Api.AuthPasswordChangeE2ETests|FullyQualifiedName~Pim.UnitTests.Api.AdminCreateUserE2ETests'
          - name: shard-3
            desc: 'Api: PcTrackerEndpoints + FilesProviderErrorSurface + OneDriveContent + TaskChecklistGet'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PcTrackerEndpointsE2ETests|FullyQualifiedName~Pim.UnitTests.Api.FilesProviderErrorSurfaceTests|FullyQualifiedName~Pim.UnitTests.Api.OneDriveContentEndpointsE2ETests|FullyQualifiedName~Pim.UnitTests.Api.TaskChecklistGetE2ETests'
          - name: shard-4
            desc: 'Api 其余类（排除前三个 shard 已分配的 8 个类）'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api&FullyQualifiedName!~PcKeystatsUploadValidationE2ETests&FullyQualifiedName!~PublicRegistrationGateE2ETests&FullyQualifiedName!~AuthPasswordChangeE2ETests&FullyQualifiedName!~AdminCreateUserE2ETests&FullyQualifiedName!~PcTrackerEndpointsE2ETests&FullyQualifiedName!~FilesProviderErrorSurfaceTests&FullyQualifiedName!~OneDriveContentEndpointsE2ETests&FullyQualifiedName!~TaskChecklistGetE2ETests'
          - name: shard-5
            desc: '非 Api-A：Notes + Files + Tiles + Services'
            filter: 'FullyQualifiedName~Pim.UnitTests.Notes|FullyQualifiedName~Pim.UnitTests.Files|FullyQualifiedName~Pim.UnitTests.Tiles|FullyQualifiedName~Pim.UnitTests.Services'
          - name: shard-6
            desc: '非 Api-B：Mcp + Harness + Calendar + PcTracker + Mobile + 其余'
            filter: 'FullyQualifiedName!~Pim.UnitTests.Api&FullyQualifiedName!~Pim.UnitTests.Notes&FullyQualifiedName!~Pim.UnitTests.Files&FullyQualifiedName!~Pim.UnitTests.Tiles&FullyQualifiedName!~Pim.UnitTests.Services'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64

      # 每片都要有完整 schema（迁移链 + 运行时初始化器），否则真库用例会因缺列失败（42703）
      - name: Initialize database schema
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 8.0.11 >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet ef database update \
            --project src/Pim.Infrastructure/Pim.Infrastructure.csproj \
            --startup-project src/Pim.Api/Pim.Api.csproj \
            --connection "$PIM_TEST_CONN"

          openssl genrsa -out "$RUNNER_TEMP/jwt.pem" 2048
          export ConnectionStrings__DefaultConnection="$PIM_TEST_CONN"
          export Jwt__PrivateKeyPath="$RUNNER_TEMP/jwt.pem"
          export DataProtection__KeysPath="$RUNNER_TEMP/dp_keys"
          export PIM_OPS_KEY=ci-temporary-ops-key
          export PIM_OPS_RO_CONNECTION="$PIM_TEST_CONN"
          export ASPNETCORE_ENVIRONMENT=Test
          export ASPNETCORE_URLS=http://127.0.0.1:5999

          dotnet run --project src/Pim.Api --no-launch-profile --no-restore > "$RUNNER_TEMP/api-init.log" 2>&1 &
          API_PID=$!
          READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5999/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          kill "$API_PID" 2>/dev/null || true
          wait "$API_PID" 2>/dev/null || true
          pkill -f "Pim.Api" 2>/dev/null || true
          sleep 2
          if [ "$READY" != "1" ]; then
            echo "::error::API 未在 120s 内就绪，运行时 schema 初始化未完成"
            tail -50 "$RUNNER_TEMP/api-init.log"
            exit 1
          fi
          echo "schema 初始化完成"

      - name: '${{ matrix.name }} — ${{ matrix.desc }}'
        env:
          # matrix.filter 是本文件内硬编码常量，非外部输入，无注入风险
          SHARD_FILTER: ${{ matrix.filter }}
          SHARD_NAME: ${{ matrix.name }}
        run: |
          set +e
          START=$(date +%s)
          dotnet test Pim.sln --configuration Release --no-restore \
            --filter "$SHARD_FILTER" \
            --logger "console;verbosity=minimal" 2>&1 | tee "/tmp/${SHARD_NAME}.log"
          # 必须取 PIPESTATUS[0]（dotnet test 的退出码）：`| tee` 会把 $? 变成 tee 的 0，
          # 导致任何测试失败都被吞掉、job 报 success（false green）。不要改回 $?。
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "=== ${SHARD_NAME} 测试耗时: $((END-START)) 秒 ==="
          grep -E 'Passed!|Failed!|Total tests|Passed:|Failed:|Skipped:' "/tmp/${SHARD_NAME}.log" | tail -5
          exit $RC

      - name: 'Upload ${{ matrix.name }} log'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.log
          retention-days: 7
