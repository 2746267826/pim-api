name: Build API

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64

      - name: Test
        run: dotnet test Pim.sln --configuration Release --no-restore

      - name: Publish API (linux-x64, framework-dependent)
        run: |
          dotnet publish src/Pim.Api/Pim.Api.csproj \
            --configuration Release \
            --no-restore \
            --runtime linux-x64 \
            -o publish/ \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -p:Version=${{ steps.ver.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Stage publish output
        run: |
          mkdir -p build/artifacts
          ARTIFACT="pim-api-v${{ steps.ver.outputs.artifact_slug }}"
          cd publish
          tar czf "../build/artifacts/${ARTIFACT}.tar.gz" .
          echo "Artifact size: $(du -sh ../build/artifacts/${ARTIFACT}.tar.gz | cut -f1)"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-api-v${{ steps.ver.outputs.artifact_slug }}
          path: build/artifacts/*.tar.gz
