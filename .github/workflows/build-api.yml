name: Build API

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    # 真库用例需要一个可用的 PostgreSQL。这里用 GitHub 托管的临时实例：
    # 随本次运行创建、结束后销毁，不接触任何真实环境，也不需要任何外部凭据。
    # 注意：TempMigrationDatabase 会自行建库/删库，要求 CREATEDB 权限
    #（官方镜像中 POSTGRES_USER 即超级用户，满足该前提）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pim_ci
          POSTGRES_PASSWORD: pim_ci_temporary
          POSTGRES_DB: pim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 指向本次运行的一次性实例；凭据仅对该临时容器有效，非任何真实环境凭据。
      # RealDbTestConnection 只读这个变量：不可达时用例显式 Skip，其余异常必须失败。
      PIM_TEST_CONN: "Host=127.0.0.1;Port=5432;Database=pim_ci;Username=pim_ci;Password=pim_ci_temporary"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64

      - name: Test
        run: dotnet test Pim.sln --configuration Release --no-restore

      - name: Publish API (linux-x64, framework-dependent)
        run: |
          dotnet publish src/Pim.Api/Pim.Api.csproj \
            --configuration Release \
            --no-restore \
            --runtime linux-x64 \
            -o publish/ \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -p:Version=${{ steps.ver.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Stage publish output
        run: |
          mkdir -p build/artifacts
          ARTIFACT="pim-api-v${{ steps.ver.outputs.artifact_slug }}"
          cd publish
          tar czf "../build/artifacts/${ARTIFACT}.tar.gz" .
          echo "Artifact size: $(du -sh ../build/artifacts/${ARTIFACT}.tar.gz | cut -f1)"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-api-v${{ steps.ver.outputs.artifact_slug }}
          path: build/artifacts/*.tar.gz
