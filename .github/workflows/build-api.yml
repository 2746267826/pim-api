name: Build API

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    # 真库用例需要一个可用的 PostgreSQL。这里用 GitHub 托管的临时实例：
    # 随本次运行创建、结束后销毁，不接触任何真实环境，也不需要任何外部凭据。
    # 注意：TempMigrationDatabase 会自行建库/删库，要求 CREATEDB 权限
    #（官方镜像中 POSTGRES_USER 即超级用户，满足该前提）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pim_ci
          POSTGRES_PASSWORD: pim_ci_temporary
          POSTGRES_DB: pim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 指向本次运行的一次性实例；凭据仅对该临时容器有效，非任何真实环境凭据。
      # RealDbTestConnection 只读这个变量：不可达时用例显式 Skip，其余异常必须失败。
      PIM_TEST_CONN: "Host=127.0.0.1;Port=5432;Database=pim_ci;Username=pim_ci;Password=pim_ci_temporary"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64

      # 真库用例假定目标库具备完整 schema，而 schema 由两部分组成：
      #   1) EF 迁移链（建基础结构）
      #   2) 运行时模块初始化器（PcTrackerSchemaInitializer 等以幂等 SQL 维护的列/索引——
      #      迁移注释明确这 12 个对象的唯一所有者是运行时，迁移链不包含它们）
      # 只做 1) 会让真库用例在查询这些列时失败（42703 column does not exist），
      # 因此这里两步都跑：先迁移，再启动一次 API 触发运行时初始化器。
      - name: Initialize database schema (migrations + runtime initializers)
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 8.0.11 >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          echo "==> 1/2 迁移链"
          dotnet ef database update \
            --project src/Pim.Infrastructure/Pim.Infrastructure.csproj \
            --startup-project src/Pim.Api/Pim.Api.csproj \
            --connection "$PIM_TEST_CONN"

          echo "==> 2/2 启动 API 触发运行时模块初始化器"
          openssl genrsa -out "$RUNNER_TEMP/jwt.pem" 2048
          export ConnectionStrings__DefaultConnection="$PIM_TEST_CONN"
          export Jwt__PrivateKeyPath="$RUNNER_TEMP/jwt.pem"
          export DataProtection__KeysPath="$RUNNER_TEMP/dp_keys"
          export PIM_OPS_KEY=ci-temporary-ops-key
          export PIM_OPS_RO_CONNECTION="$PIM_TEST_CONN"
          export ASPNETCORE_ENVIRONMENT=Test
          export ASPNETCORE_URLS=http://127.0.0.1:5999

          # --no-restore：避免覆盖上一步带 --runtime linux-x64 生成的 assets
          #（否则后续 "Publish --runtime linux-x64" 会报 NETSDK1047）
          dotnet run --project src/Pim.Api --no-launch-profile --no-restore > "$RUNNER_TEMP/api-init.log" 2>&1 &
          API_PID=$!
          READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5999/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          # 顺便导出客户端契约（Test 环境映射了 /openapi/v1.json）
          if [ "$READY" = "1" ]; then
            if curl -sf http://127.0.0.1:5999/swagger/v1/swagger.json -o "$RUNNER_TEMP/openapi.generated.json"; then
              echo "已导出契约：$(wc -c < "$RUNNER_TEMP/openapi.generated.json") 字节"
            else
              echo "::warning::未能导出 /swagger/v1/swagger.json"
            fi
          fi
          kill "$API_PID" 2>/dev/null || true
          wait "$API_PID" 2>/dev/null || true
          # dotnet run 会再派生实际的应用进程；一并结束，避免残留进程占用构建输出
          pkill -f "Pim.Api" 2>/dev/null || true
          sleep 2
          if [ "$READY" != "1" ]; then
            echo "::error::API 未在 120s 内就绪，运行时 schema 初始化可能未完成"
            tail -50 "$RUNNER_TEMP/api-init.log"
            exit 1
          fi
          echo "schema 初始化完成（迁移链 + 运行时初始化器）"
          # 保险：确认带 RID 的 assets 仍然可用
          dotnet restore Pim.sln --runtime linux-x64

      # 契约必须与代码同步：客户端仓按 contract/openapi.json 生成类型，
      # 过期会让前端拿到错的接口形状，所以这里硬校验。
      - name: Verify client contract is up to date
        shell: bash
        run: |
          set -uo pipefail
          GEN="$RUNNER_TEMP/openapi.generated.json"
          if [ ! -s "$GEN" ]; then
            echo "::error::未生成契约文件，无法校验（请检查 API 是否成功启动）"
            exit 1
          fi
          mkdir -p contract
          if [ -f contract/openapi.json ] && diff -q contract/openapi.json "$GEN" >/dev/null 2>&1; then
            echo "✅ contract/openapi.json 与当前代码一致"
          else
            cp "$GEN" contract/openapi.json.generated
            echo "::error::contract/openapi.json 与当前代码不一致；最新契约已作为 artifact 上传，下载后覆盖提交即可。"
            exit 1
          fi

      - name: Upload generated contract (stale)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-generated
          path: contract/openapi.json.generated
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        run: |
          dotnet test Pim.sln --configuration Release --no-restore

      - name: Publish API (linux-x64, framework-dependent)
        run: |
          dotnet publish src/Pim.Api/Pim.Api.csproj \
            --configuration Release \
            --no-restore \
            --runtime linux-x64 \
            -o publish/ \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -p:Version=${{ steps.ver.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Stage publish output
        run: |
          mkdir -p build/artifacts
          ARTIFACT="pim-api-v${{ steps.ver.outputs.artifact_slug }}"
          cd publish
          tar czf "../build/artifacts/${ARTIFACT}.tar.gz" .
          echo "Artifact size: $(du -sh ../build/artifacts/${ARTIFACT}.tar.gz | cut -f1)"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-api-v${{ steps.ver.outputs.artifact_slug }}
          path: build/artifacts/*.tar.gz
