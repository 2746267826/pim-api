name: Build Web Client

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client-web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version if needed
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/client-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec playwright -- install --with-deps chromium

      # 前端门禁 = 既有 schedule-workbench 链 + pcRoute3Types 契约类型用例 + **全量** vitest。
      # 过去的固定脚本链不覆盖 `src/components/charts/__tests__`、`src/components/pc-tracker/__tests__`、
      # `src/utils/__tests__`，等于 CI 全绿而新增用例根本没跑（#376）。
      # vitest 会打印 `Test Files / Tests / Duration`，用例总数与耗时直接可见。
      # 门禁内容由 src/client-web/src/__tests__/ciFrontendGate.test.ts 自检，防止被悄悄摘掉。
      - name: Frontend tests (full unit suite + tsx contract suites)
        run: npm run test:frontend-gate

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_GIT_SHA: ${{ steps.ver.outputs.git_sha_short }}

      - name: Package web build
        run: tar -czf pim-web-v${{ steps.ver.outputs.artifact_slug }}.tar.gz -C ../Pim.Api/wwwroot .

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-web-v${{ steps.ver.outputs.artifact_slug }}
          path: src/client-web/pim-web-*.tar.gz
          if-no-files-found: error
