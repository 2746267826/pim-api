name: Build Web Client

on:
  push:
    branches: [master, codex/schedule-task-complete-system]
    paths:
      - 'src/client-web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

env:
  # Generate version string: 1.0.0(abc1234)
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0({0})', github.sha) }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client-web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/client-web/package-lock.json

      - name: Generate version string
        id: version
        run: |
          VERSION=$(git describe --tags --always --match "v*" 2>/dev/null || echo "0.0.0")
          # Convert v1.0.0-2-gabc1234 → 1.0.0(abc1234)
          DISPLAY=$(echo "$VERSION" | sed 's/^v//' | sed 's/-[0-9]*-g\([0-9a-f]\{7\}$\)/\(\1\)/' | sed 's/-g\([0-9a-f]\{7\}$\)/\(\1\)/')
          echo "value=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "version=$DISPLAY"

      - name: Install dependencies
        run: npm ci

      - name: Schedule workbench tests
        run: npm run test:schedule-workbench-complete

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pim-web-build
          path: src/Pim.Api/wwwroot/
          if-no-files-found: error
