name: Build MCP

# MCP server 构建（issues #178/#179 引入）。
# 由 ci.yml 以 workflow_call 调用：矩阵测试兼容 mcp SDK 1.x/2.x，通过后打包
# pim-mcp-server-<version>.tar.gz（pim_mcp_server.py + deploy/ 模板）上传 artifact，
# 与其他平台一样跟随主版本线 release；本次未构建时由 release job 复用上一个 release 的产物。
# workflow_dispatch 可用于手动触发调试（version 留空则自动生成 dev 版本号）。

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: mcp SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['1.x', '2.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          if [ "${{ matrix.sdk }}" = "1.x" ]; then
            python -m pip install --quiet "mcp==1.*" uvicorn pytest httpx
          else
            # 2.x：刻意不装 httpx，让脚本的 httpx2 回退分支（issue #179 修复点）在 CI 真实执行；
            # httpx2 显式安装，避免依赖 mcp 的传递依赖变动导致 CI 不稳定
            python -m pip install --quiet "mcp>=2,<3" httpx2 uvicorn pytest
          fi

      - name: Self-check (--check)
        run: python scripts/mcp/pim_mcp_server.py --check

      - name: Unit tests
        run: python -m pytest scripts/mcp/test_pim_mcp_server.py -q

      - name: HTTP integration smoke
        run: python scripts/mcp/integration_http_smoke.py

  package:
    needs: test
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package MCP server artifact
        shell: bash
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/mcp"
          cp scripts/mcp/pim_mcp_server.py "$STAGE/mcp/"
          cp -r scripts/mcp/deploy "$STAGE/mcp/"
          cd "$STAGE"
          tar czf "pim-mcp-server-${{ steps.ver.outputs.version }}.tar.gz" mcp/
          cp "pim-mcp-server-${{ steps.ver.outputs.version }}.tar.gz" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          ls -la "pim-mcp-server-${{ steps.ver.outputs.version }}.tar.gz"

      - name: Upload MCP artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-mcp-server-${{ steps.ver.outputs.version }}
          path: pim-mcp-server-${{ steps.ver.outputs.version }}.tar.gz
          if-no-files-found: error