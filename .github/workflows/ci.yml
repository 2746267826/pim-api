name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      client_patch:
        description: Optional client patch suffix (e.g. android.1)
        required: false
        default: ''
        type: string
      force_all:
        description: Force all platform builds
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      is_release: ${{ steps.ver.outputs.is_release }}
      year_month: ${{ steps.ver.outputs.year_month }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          client_patch: ${{ github.event_name == 'workflow_dispatch' && inputs.client_patch || '' }}
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      all: ${{ steps.flags.outputs.all }}
      api: ${{ steps.flags.outputs.api }}
      web: ${{ steps.flags.outputs.web }}
      windows: ${{ steps.flags.outputs.windows }}
      android: ${{ steps.flags.outputs.android }}
      docker: ${{ steps.flags.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First-ever master push: no release exists yet, so no artifacts can be
      # copied from a previous release - force a full build instead.
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName // empty' 2>/dev/null || true)"
          if [[ -n "$TAG" ]]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/Pim.Api/**'
              - 'src/Pim.Core/**'
              - 'src/Pim.Infrastructure/**'
              - 'src/modules/**'
              - 'tests/Pim.UnitTests/**'
              - 'Pim.sln'
              - 'src/Directory.Build.props'
              - 'scripts/ci/**'
              - '.github/workflows/build-api.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'src/client-web/**'
              - 'branding/**'
              - 'scripts/branding/**'
              - '.github/workflows/build-web.yml'
              - '.github/workflows/ci.yml'
            windows:
              - 'src/client-windows/**'
              - 'src/Directory.Build.props'
              - 'branding/**'
              - '.github/workflows/build-windows.yml'
              - '.github/workflows/ci.yml'
            android:
              - 'src/client-android/**'
              - 'branding/**'
              - '.github/workflows/build-android.yml'
              - '.github/workflows/ci.yml'
            docker:
              - 'src/Pim.Api/Dockerfile'
              - 'scripts/docker/**'
              - '.github/workflows/build-docker.yml'
              - '.github/workflows/ci.yml'
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
            infra:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'

      - id: flags
        shell: bash
        run: |
          # workflow_dispatch: force_all or always build all
          # push (master) / pull_request: path filters; infra changes or first push => all
          FORCE_ALL="${{ github.event_name == 'workflow_dispatch' && inputs.force_all || false }}"
          FIRST_PUSH="${{ github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' || false }}"
          NO_RELEASE="${{ github.event_name == 'push' && steps.rel.outputs.has_release == 'false' || false }}"
          if [ "$FORCE_ALL" = "true" ] \
            || [ "$FIRST_PUSH" = "true" ] \
            || [ "$NO_RELEASE" = "true" ] \
            || [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "windows=${{ steps.filter.outputs.windows }}" >> "$GITHUB_OUTPUT"
            echo "android=${{ steps.filter.outputs.android }}" >> "$GITHUB_OUTPUT"
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/build-api.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-web:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-windows:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-android:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  build-docker:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      is_release: ${{ needs.resolve-version.outputs.is_release }}

  summarize:
    needs: [resolve-version, changes, build-api, build-web, build-windows, build-android, build-docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print build summary
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "## ✅ CI Build Summary — v${VERSION}" 
          echo ""
          echo "| Platform | Status |"
          echo "|:---------|:-------|"
          echo "| 🖥️  API     | ${{ needs.build-api.result == 'success' && '✅ Built' || needs.build-api.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🌐  Web     | ${{ needs.build-web.result == 'success' && '✅ Built' || needs.build-web.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🪟  Windows | ${{ needs.build-windows.result == 'success' && '✅ Built' || needs.build-windows.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🐳  Docker  | ${{ needs.build-docker.result == 'success' && '✅ Built' || needs.build-docker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 📱  Android | ${{ needs.build-android.result == 'success' && '✅ Built' || needs.build-android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo ""
          echo "> Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release:
    needs: [resolve-version, summarize, build-api, build-web, build-windows, build-android, build-docker]
    # Release on every master push where no build failed. Skipped (unchanged)
    # components are fine: their assets are copied from the previous release.
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only changes build nothing - skip the release entirely.
      - name: Decide whether to create a release
        id: decide
        run: |
          BUILT=0
          for r in "${{ needs.build-api.result }}" "${{ needs.build-web.result }}" \
                    "${{ needs.build-windows.result }}" "${{ needs.build-android.result }}" \
                    "${{ needs.build-docker.result }}"; do
            if [ "$r" = "success" ]; then BUILT=$((BUILT+1)); fi
          done
          if [ "$BUILT" -gt 0 ]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No component changed; skipping release"
          fi

      - name: Download release artifacts
        if: steps.decide.outputs.do_release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pim-*
          merge-multiple: true
          path: release-assets

      # For components that were not rebuilt this run, reuse the asset from the
      # latest release as-is (same file name and version number - the artifact
      # version stays consistent with its content).
      - name: Fill missing assets from last release
        if: steps.decide.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName // empty' 2>/dev/null || true)"
          copy_if_missing() {
            local pattern="$1"
            if ! ls release-assets/${pattern} >/dev/null 2>&1; then
              if [[ -z "$TAG" ]]; then
                echo "::error::No previous release to copy ${pattern} from; run a full build" >&2
                exit 1
              fi
              gh release download "$TAG" --pattern "$pattern" --dir release-assets
            fi
          }
          # Only replace skipped (unchanged) components with last release's
          # assets; any other non-success result is unexpected here and must
          # fail loudly instead of silently publishing a stale asset.
          fill_if_skipped() {
            local result="$1" pattern="$2"
            if [ "$result" = "skipped" ]; then
              copy_if_missing "$pattern"
            elif [ "$result" != "success" ]; then
              echo "::error::Unexpected build result '${result}' for ${pattern}; not replacing with a stale asset" >&2
              exit 1
            fi
          }
          fill_if_skipped "${{ needs.build-api.result }}" 'pim-api-*.tar.gz'
          fill_if_skipped "${{ needs.build-web.result }}" 'pim-web-*.tar.gz'
          fill_if_skipped "${{ needs.build-windows.result }}" 'pim-windows-*.zip'
          fill_if_skipped "${{ needs.build-android.result }}" 'pim-android-*.apk'
          fill_if_skipped "${{ needs.build-docker.result }}" 'pim-platform-server-*.tar.gz'
          # Sanity check: every asset family must be present before uploading.
          for p in pim-api-*.tar.gz pim-web-*.tar.gz pim-windows-*.zip pim-android-*.apk pim-platform-server-*.tar.gz; do
            ls release-assets/${p} >/dev/null 2>&1 \
              || { echo "::error::Missing release asset family: ${p}" >&2; exit 1; }
          done
          ls -la release-assets/

      - name: Build release notes from merged PRs
        if: steps.decide.outputs.do_release == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(bash scripts/ci/build-release-notes.sh \
            --repo "${{ github.repository }}" \
            --to-tag "v${{ needs.resolve-version.outputs.version }}")"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.decide.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: v${{ needs.resolve-version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release-assets/pim-api-*.tar.gz
            release-assets/pim-web-*.tar.gz
            release-assets/pim-windows-*.zip
            release-assets/pim-android-*.apk
            release-assets/pim-platform-server-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
