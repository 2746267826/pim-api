name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      client_patch:
        description: Optional client patch suffix (e.g. android.1)
        required: false
        default: ''
        type: string
      force_all:
        description: Force all builds
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  packages: write
  pull-requests: read

# Serialize runs per ref. Two PRs merged a minute apart start two CI runs that
# publish releases: run B must not be able to look at run A's half-finished
# release as "the previous release" (and vice versa). Queued runs wait for the
# running one instead of cancelling it, so a finished build is never thrown
# away. PR runs get their own group per PR ref and are unaffected.
#
# Note: GitHub keeps only ONE pending run per concurrency group - a third fast
# push can displace a still-pending run. That is why the changed-component
# filters below diff against the last release tag instead of the previous push:
# whatever the displaced run would have built is picked up by the surviving run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      is_release: ${{ steps.ver.outputs.is_release }}
      year_month: ${{ steps.ver.outputs.year_month }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          client_patch: ${{ github.event_name == 'workflow_dispatch' && inputs.client_patch || '' }}
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.flags.outputs.all }}
      api: ${{ steps.flags.outputs.api }}
      docker: ${{ steps.flags.outputs.docker }}
      mcp: ${{ steps.flags.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the PREVIOUS release by version number (not by release creation
      # time) and hand it to the path filters below.
      #
      # First-ever master push: no release exists yet, so no artifacts can be
      # copied from a previous release - force a full build instead.
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(bash "$GITHUB_WORKSPACE/scripts/ci/latest-release-tag.sh" \
            --repo "$GITHUB_REPOSITORY" || true)"
          if [[ -n "$TAG" ]]; then
            echo "previous_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous release: ${TAG:-(none)}"

      # Diff base = the previous release tag, i.e. "what changed since the last
      # thing we published" instead of "what changed in this push".
      #
      # Why: a burst of merges can displace a still-pending run (see the
      # concurrency block), and a run can also be cancelled by hand or fail
      # before its release job. Diffing against the last release guarantees the
      # surviving run rebuilds every component that changed since then, instead
      # of silently carrying over a stale asset for a component that did change.
      # In the normal case (one merge per release) both diffs are identical.
      #
      # `base` is ignored for pull_request events, so PR checks are unchanged.
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.rel.outputs.previous_tag }}
          filters: |
            api:
              - 'src/Pim.Api/**'
              - 'src/Pim.Core/**'
              - 'src/Pim.Infrastructure/**'
              - 'src/modules/**'
              - 'tests/Pim.UnitTests/**'
              - 'Pim.sln'
              - 'src/Directory.Build.props'
              - 'scripts/ci/**'
              - '.github/workflows/build-api.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docker:
              - 'src/Pim.Api/Dockerfile'
              - 'scripts/docker/**'
              - '.github/workflows/build-docker.yml'
              - '.github/workflows/ci.yml'
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
            mcp:
              - 'scripts/mcp/**'
              - '.github/workflows/build-mcp.yml'
            infra:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'

      - id: flags
        shell: bash
        run: |
          if [ "$FORCE_ALL" = "true" ] \
            || [ "$FIRST_PUSH" = "true" ] \
            || [ "$NO_RELEASE" = "true" ] \
            || [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
            echo "mcp=${{ steps.filter.outputs.mcp }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/build-api.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-docker:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      is_release: ${{ needs.resolve-version.outputs.is_release }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}

  build-mcp:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/build-mcp.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  summarize:
    needs: [resolve-version, changes, build-api, build-docker, build-mcp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print build summary
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "## ✅ CI Build Summary — v${VERSION}" 
          echo ""
          echo "| Platform | Status |"
          echo "|:---------|:-------|"
          echo "| 🖥️  API     | ${{ needs.build-api.result == 'success' && '✅ Built' || needs.build-api.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🐳  Docker  | ${{ needs.build-docker.result == 'success' && '✅ Built' || needs.build-docker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🤖 MCP | ${{ needs.build-mcp.result == 'success' && '✅ Built' || needs.build-mcp.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo ""
          echo "> Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # 汇总门禁：把「子任务失败 / 应跑却未跑」变成整体失败。
  #
  # 为什么需要它：`summarize` 虽然 `if: always()`，但只打印表格，
  # 无论子任务结果如何都返回成功，因此无法作为分支保护的必需检查。
  # 本 job 名称固定（CI Gate）、总在运行，且在下列任一情形失败：
  #   1) 任一必需 job 结果为 failure / cancelled；
  #   2) `changes` 判定某组件「应当重建」，但对应 job 以 skipped 结束（疑似静默漏跑）。
  # 反之，因路径过滤而未变化、按设计被跳过的组件视为正常。
  #
  # 维护提示：本 job 的 `should` 判定必须与各 build-* job 的 `if` 条件保持一致；
  # 修改那些 if 条件（例如新增组件、调整路径过滤）时，请同步更新这里，否则会漏报或误报。
  gate:
    name: CI Gate
    needs: [resolve-version, changes, build-api, build-docker, build-mcp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_API: ${{ needs.build-api.result }}
          R_DOCKER: ${{ needs.build-docker.result }}
          R_MCP: ${{ needs.build-mcp.result }}
          W_ALL: ${{ needs.changes.outputs.all }}
          W_API: ${{ needs.changes.outputs.api }}
          W_DOCKER: ${{ needs.changes.outputs.docker }}
          W_MCP: ${{ needs.changes.outputs.mcp }}
        run: |
          set -uo pipefail
          fail=0

          # 该组件本次是否被判定为「应当重建」（任一 flag 为 true，或 all 为 true）
          should () {
            if [ "$W_ALL" = "true" ]; then echo true; return; fi
            for flag in "$@"; do
              if [ "$flag" = "true" ]; then echo true; return; fi
            done
            echo false
          }

          # result: 子任务结果；wanted: 是否应当运行（true/false）
          check () {
            local label="$1" result="$2" wanted="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            elif [ "$result" = "skipped" ] && [ "$wanted" != "true" ]; then
              echo "⏭️  $label — skipped（该组件本次无变化，按设计跳过）"
            elif [ "$result" = "skipped" ]; then
              echo "❌ $label — 判定应当重建，却以 skipped 结束（疑似静默漏跑）"
              fail=1
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }

          # 基础 job 必须成功（它们决定后续过滤与版本解析）
          check "resolve-version" "$R_RESOLVE" "true"
          check "changes"         "$R_CHANGES" "true"

          check "build-api"                       "$R_API"           "$(should "$W_API")"
          check "build-docker"                    "$R_DOCKER"        "$(should "$W_API" "$W_DOCKER")"
          check "build-mcp"                       "$R_MCP"           "$(should "$W_MCP")"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或疑似静默跳过的必需 job。"
            exit 1
          fi

          echo ""
          echo "CI Gate 通过：所有必需 job 均成功，或因组件无变化而按设计跳过。"

  release:
    needs: [resolve-version, summarize, build-api, build-docker, build-mcp]
    # Release on every master push where no build failed. Skipped (unchanged)
    # components are fine: their assets are copied from the previous release.
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only changes build nothing - skip the release entirely.
      - name: Decide whether to create a release
        id: decide
        run: |
          BUILT=0
          for r in "${{ needs.build-api.result }}" \
                    "${{ needs.build-docker.result }}" \
                    "${{ needs.build-mcp.result }}"; do
            if [ "$r" = "success" ]; then BUILT=$((BUILT+1)); fi
          done
          if [ "$BUILT" -gt 0 ]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No component changed; skipping release"
          fi

      - name: Download release artifacts
        if: steps.decide.outputs.do_release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pim-*
          merge-multiple: true
          path: release-assets

      # Previous release, used for asset carry-over AND for the changelog
      # window. Resolved once, by version number, excluding this run's own tag
      # (on a re-run the tag already exists and must not be seen as "previous").
      - name: Resolve previous release tag
        if: steps.decide.outputs.do_release == 'true'
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(bash "$GITHUB_WORKSPACE/scripts/ci/latest-release-tag.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --exclude "${{ needs.resolve-version.outputs.release_tag }}" || true)"
          echo "Previous release: ${TAG:-(none)}"
          if [[ -n "$TAG" ]] && ! git merge-base --is-ancestor "$TAG" HEAD; then
            # Carried-over assets and the changelog window are both defined as
            # "the diff between TAG and this release". When the repository
            # history has been rewritten (e.g. the split into pim-api / pim-web /
            # pim-android / pim-windows), the previous tag no longer belongs to
            # this history: the diff is meaningless and the carry-over would
            # copy assets built on an unrelated base. Fall back to "no previous
            # release" instead - every component is rebuilt in that case, which
            # is exactly what a history-rewriting change requires anyway.
            echo "::warning::$TAG is not an ancestor of HEAD (history rewritten); discarding the previous-release baseline and publishing a full build"
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # For components that were not rebuilt this run, reuse the asset from the
      # previous release as-is (same file name and version number - the artifact
      # version stays consistent with its content).
      - name: Fill missing assets from last release
        if: steps.decide.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          TAG="$PREVIOUS_TAG"
          copy_if_missing() {
            local pattern="$1"
            if ! ls release-assets/${pattern} >/dev/null 2>&1; then
              if [[ -z "$TAG" ]]; then
                echo "::error::No previous release to copy ${pattern} from; run a full build" >&2
                exit 1
              fi
              gh release download "$TAG" --pattern "$pattern" --dir release-assets
            fi
          }
          # Only replace skipped (unchanged) components with last release's
          # assets; any other non-success result is unexpected here and must
          # fail loudly instead of silently publishing a stale asset.
          fill_if_skipped() {
            local result="$1" pattern="$2"
            if [ "$result" = "skipped" ]; then
              copy_if_missing "$pattern"
            elif [ "$result" != "success" ]; then
              echo "::error::Unexpected build result '${result}' for ${pattern}; not replacing with a stale asset" >&2
              exit 1
            fi
          }
          fill_if_skipped "${{ needs.build-api.result }}" 'pim-api-*.tar.gz'
          fill_if_skipped "${{ needs.build-docker.result }}" 'pim-api-server-*.tar.gz'
          fill_if_skipped "${{ needs.build-mcp.result }}" 'pim-mcp-server-*.tar.gz'
          # Sanity check: every asset family must be present before uploading.
          for p in pim-api-*.tar.gz pim-api-server-*.tar.gz pim-mcp-server-*.tar.gz; do
            ls release-assets/${p} >/dev/null 2>&1 \
              || { echo "::error::Missing release asset family: ${p}" >&2; exit 1; }
          done
          ls -la release-assets/

      - name: Build release notes from merged PRs
        if: steps.decide.outputs.do_release == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same window as the carried-over assets: merged PRs between the
          # previous release and this one.
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          FROM_ARGS=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            FROM_ARGS+=(--from-tag "$PREVIOUS_TAG")
          fi
          NOTES="$(bash scripts/ci/build-release-notes.sh \
            --repo "${{ github.repository }}" \
            --to-tag "${{ needs.resolve-version.outputs.release_tag }}" \
            "${FROM_ARGS[@]}")"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.decide.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          # Pin the tag to the commit this run actually built. Without it the
          # release API creates the tag wherever the default branch points at
          # tag-creation time, so a slower run can end up tagged with a commit
          # it never built (observed: v2026.09.488 was tagged 70f5ec44 while it
          # built 8b7adb6d, which also broke the changelog window).
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.release_tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release-assets/pim-api-*.tar.gz
            release-assets/pim-api-server-*.tar.gz
            release-assets/pim-mcp-server-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
