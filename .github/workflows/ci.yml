name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      client_patch:
        description: Optional client patch suffix (e.g. android.1)
        required: false
        default: ''
        type: string
      force_all:
        description: Force all builds
        required: false
        default: true
        type: boolean
      # 契约输入名（工单 §5）：前端版本引用 + 只重建镜像开关。
      # 两个都必须在 ci.yml 的 workflow_dispatch.inputs 声明（否则 workflow_dispatch
      # 根本收不到），web_dist_ref 还必须在 build-docker.yml 的 workflow_call.inputs
      # 里同步声明才能一路传到镜像构建（见 REQ-4 的「输入要真正送达」）。
      web_dist_ref:
        description: 'Frontend dist image ref to embed (e.g. sha-abc1234). Empty = latest, frozen once at build start'
        required: false
        default: ''
        type: string
      rebuild_image_only:
        description: 'Only rebuild the API image (carry API/MCP assets over). Auto-upgrades to a full build when the backend changed'
        required: false
        default: false
        type: boolean
      # 契约同步（#415）的补发开关：契约检测本身是自动的（master 上 contract/openapi.json
      # 真的变了、且通过了 build-api 的硬校验，就通知三个客户端仓）。这个输入用于
      # 「通知没发出去 / 客户端漏收 / 需要重新投递」时手动补发一次。
      # 它是真接线的（被 contract-notify 消费并覆盖检测结果），不是死参数。
      force_contract_notify:
        description: 'Force a contract-updated dispatch to the client repos (manual re-notify; clients de-duplicate by bytes)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  packages: write
  pull-requests: read

# Serialize runs per ref. Two PRs merged a minute apart start two CI runs that
# publish releases: run B must not be able to look at run A's half-finished
# release as "the previous release" (and vice versa). Queued runs wait for the
# running one instead of cancelling it, so a finished build is never thrown
# away. PR runs get their own group per PR ref and are unaffected.
#
# Note: GitHub keeps only ONE pending run per concurrency group - a third fast
# push can displace a still-pending run. That is why the changed-component
# filters below diff against the last release tag instead of the previous push:
# whatever the displaced run would have built is picked up by the surviving run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      is_release: ${{ steps.ver.outputs.is_release }}
      year_month: ${{ steps.ver.outputs.year_month }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          client_patch: ${{ github.event_name == 'workflow_dispatch' && inputs.client_patch || '' }}
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.flags.outputs.all }}
      api: ${{ steps.flags.outputs.api }}
      docker: ${{ steps.flags.outputs.docker }}
      mcp: ${{ steps.flags.outputs.mcp }}
      rebuild_image_only: ${{ steps.flags.outputs.rebuild_image_only }}
      backend_changed: ${{ steps.flags.outputs.backend_changed }}
      baseline_ok: ${{ steps.baseline.outputs.ok }}
      previous_tag: ${{ steps.rel.outputs.previous_tag }}
      contract_changed: ${{ steps.contract.outputs.changed }}
      contract_sha256: ${{ steps.contract.outputs.contract_sha256 }}
      contract_bytes: ${{ steps.contract.outputs.contract_bytes }}
      contract_commit: ${{ steps.contract.outputs.contract_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the PREVIOUS release by version number (not by release creation
      # time) and hand it to the path filters below.
      #
      # First-ever master push: no release exists yet, so no artifacts can be
      # copied from a previous release - force a full build instead.
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(bash "$GITHUB_WORKSPACE/scripts/ci/latest-release-tag.sh" \
            --repo "$GITHUB_REPOSITORY" || true)"
          if [[ -n "$TAG" ]]; then
            echo "previous_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous release: ${TAG:-(none)}"

      # Diff base = the previous release tag, i.e. "what changed since the last
      # thing we published" instead of "what changed in this push".
      #
      # Why: a burst of merges can displace a still-pending run (see the
      # concurrency block), and a run can also be cancelled by hand or fail
      # before its release job. Diffing against the last release guarantees the
      # surviving run rebuilds every component that changed since then, instead
      # of silently carrying over a stale asset for a component that did change.
      # In the normal case (one merge per release) both diffs are identical.
      #
      # `base` is ignored for pull_request events, so PR checks are unchanged.
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.rel.outputs.previous_tag }}
          filters: |
            api:
              - 'src/Pim.Api/**'
              - 'src/Pim.Core/**'
              - 'src/Pim.Infrastructure/**'
              - 'src/modules/**'
              - 'tests/Pim.UnitTests/**'
              - 'Pim.sln'
              - 'src/Directory.Build.props'
              # 契约是本仓对客户端的产出，且**只有 build-api 能证明它与代码同步**
              # （契约硬校验 `Verify client contract is up to date` 就在该 job 里）。
              # 漏掉这一条就是工单 §9 的"假绿"：只改 contract/openapi.json 的 PR
              # 所有 flag 全不亮 → build-api 整条跳过 → CI 全绿但契约从未被校验。
              - 'contract/**'
              - 'scripts/ci/**'
              - '.github/workflows/build-api.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docker:
              - 'src/Pim.Api/Dockerfile'
              - 'scripts/docker/**'
              - '.github/workflows/build-docker.yml'
              - '.github/workflows/ci.yml'
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
            mcp:
              - 'scripts/mcp/**'
              - '.github/workflows/build-mcp.yml'
            infra:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'

      # 基线是否可用：上一版 tag 必须是本次 HEAD 的祖先。历史被改写时（例如拆仓）
      # 那个 tag 上的 diff 没有意义、资产也不能搬运 —— 必须退回"全量构建"，
      # 而不是等到 release job 搬运时才报错（REQ-5）。
      - id: baseline
        env:
          PREV_TAG: ${{ steps.rel.outputs.previous_tag }}
        run: |
          set -uo pipefail
          if [[ -z "$PREV_TAG" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "没有上一版 release → 基线不可用（按首次发布处理，全量构建）"
            exit 0
          fi
          if git merge-base --is-ancestor "$PREV_TAG" HEAD; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "基线可用：$PREV_TAG 是 HEAD 的祖先"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$PREV_TAG 不是 HEAD 的祖先（历史被改写）→ 放弃基线，按全量构建处理"
          fi

      # 上一版 release 有没有台账资产（REQ-7）。没有台账时必须重烘镜像，
      # 否则这次 release 只能去搬一个不存在的资产并失败。
      - id: prevledger
        if: steps.rel.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.rel.outputs.previous_tag }}
        run: |
          set -uo pipefail
          if gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx 'pim-web-version.json'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "上一版 release(${PREV_TAG}) 带 pim-web-version.json 台账"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "上一版 release(${PREV_TAG}) 没有台账资产（过渡态）→ 将强制重烘镜像以产出本次台账"
          fi

      # ---------------------------------------------------------------------
      # 契约变化检测（工单 #415 §9.2）。
      #
      # 为什么**不**复用上面 paths-filter 的结果：filter 回答的是「相对 base 有哪些
      # 文件被改动」，而通知要问的是「contract/openapi.json 的**字节**是否变了」。
      # §9 的假绿根因就是变更检测漏掉 contract/**；把判定做成独立脚本后，它不再
      # 依赖那份可能被改窄的过滤器（scripts/ci/detect-contract-change.sh + 行为测试）。
      #
      # 基线口径与上面的组件判定保持一致：优先「上一版 release tag」——
      # concurrency 那段注释说明过，一个突发 push 会把还在排队的 run 挤掉，
      # 相对"上一个 push"做 diff 会漏掉被挤掉那次里的契约变化；相对"上一版已发布
      # 的东西"做 diff 则由存活下来的 run 兜住。基线不可用/被改写时按"可能变了"
      # 处理（fail-open：宁可多发一次通知，客户端按字节去重不会开出空 PR）。
      #
      # 注意这跟 build-api 的 if 是同源的：contract/** 已在 api 过滤器里，
      # 所以"判定为变了"的正常情形下 build-api 必然运行，契约先被硬校验过再通知。
      # ---------------------------------------------------------------------
      - id: contract
        env:
          PREV_TAG: ${{ steps.rel.outputs.previous_tag }}
          BASELINE_OK: ${{ steps.baseline.outputs.ok }}
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_contract_notify || 'false' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          BASE=""
          if [[ -n "$PREV_TAG" && "$BASELINE_OK" == "true" ]]; then
            BASE="$PREV_TAG"
            echo "契约检测基线：上一版 release $BASE"
          elif [[ -n "$EVENT_BEFORE" ]]; then
            BASE="$EVENT_BEFORE"
            echo "契约检测基线：本次 push 的 before $BASE（没有可用的上一版 release）"
          else
            echo "::warning::没有可用的契约检测基线（无上一版 release、无 push.before）→ 按「契约可能已变化」处理"
          fi
          FORCE="${FORCE_NOTIFY:-false}"; FORCE="${FORCE:-false}"
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force_contract_notify=true → 跳过字节比较，直接按「已变化」处理并通知客户端仓"
          fi
          bash "$GITHUB_WORKSPACE/scripts/ci/detect-contract-change.sh" \
            --base "$BASE" --head "$HEAD_SHA" --force "$FORCE"

      - id: flags
        shell: bash
        # 判定逻辑在 scripts/ci/decide-components.sh 里（可被组合测试覆盖，见 test-decide-components.sh）。
        # 历史坑：force_all 输入曾只被"引用"而没有定义（$FORCE_ALL/$FIRST_PUSH/$NO_RELEASE 全仓无定义），
        # 手动触发时恒为空串 → 开关形同虚设（伪生效）。现在这些变量都有真实定义。
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || 'false' }}
          REBUILD_IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_image_only || 'false' }}
          BASELINE_OK: ${{ steps.baseline.outputs.ok }}
          PREVIOUS_TAG: ${{ steps.rel.outputs.previous_tag }}
          PREVIOUS_LEDGER: ${{ steps.prevledger.outputs.present }}
          F_INFRA: ${{ steps.filter.outputs.infra }}
          F_API: ${{ steps.filter.outputs.api }}
          F_DOCKER: ${{ steps.filter.outputs.docker }}
          F_MCP: ${{ steps.filter.outputs.mcp }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/decide-components.sh"

  # 前端产物镜像的解析/冻结（REQ-3）与「防重复发版」判定（REQ-6）。
  #
  # 为什么单独一个 job 且放在镜像构建**之前**：冻结值必须在构建开始时确定并只解析一次，
  # 后续镜像内容、台账、比对全部用同一个不可变引用；而「本次是否要发版」又要在这个
  # 引用拿到之后、镜像被推之前决定（不发版时不得推出新镜像 tag、不得产生新镜像）。
  web-dist:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.web_dist_image }}
      ref: ${{ steps.resolve.outputs.web_dist_ref }}
      digest: ${{ steps.resolve.outputs.web_dist_digest }}
      version: ${{ steps.resolve.outputs.web_version }}
      git_sha: ${{ steps.resolve.outputs.web_git_sha }}
      built_at: ${{ steps.resolve.outputs.web_built_at }}
      publish: ${{ steps.decide.outputs.publish }}
      dedupe_reason: ${{ steps.decide.outputs.dedupe_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新增的发布脚本先自检（纯逻辑、不依赖 registry）：判定规则错了要在这一步就红。
      - name: Self-test release scripts
        run: |
          set -euo pipefail
          bash scripts/ci/test-decide-components.sh
          bash scripts/ci/test-evaluate-gate.sh
          bash scripts/ci/test-release-dedupe.sh
          bash scripts/ci/test-resolve-web-dist.sh
          bash scripts/ci/test-build-web-ledger.sh
          # 契约变更检测与客户端通知（#415）：判定错了/请求发错了不会有别的信号，
          # 只会静默地"永远不通知"，所以这两套行为测试是必需的，不是装饰。
          bash scripts/ci/test-detect-contract-change.sh
          bash scripts/ci/test-notify-contract-sync.sh
          # 过滤器配置本身也要有回归测试：漏掉 contract/** 不会有任何报错，
          # 只会静默回到"契约-only 的 PR 全绿但契约没被校验"（工单 §9 的假绿）。
          bash scripts/ci/test-contract-filter.sh

      # 解析并冻结前端产物镜像引用；失败即红（拉不到 / 文件缺失 / 引用与内容不同源）。
      - name: Resolve and freeze frontend dist ref
        id: resolve
        run: |
          bash scripts/ci/resolve-web-dist.sh \
            --ref "${{ github.event_name == 'workflow_dispatch' && inputs.web_dist_ref || '' }}"

      # 上一版台账（REQ-6 的比对数据源）。取不到不算错：判定脚本会按「无上一版台账，
      # 按需发版处理」走，并且把这件事写进 summary（不报错中断、也不静默跳过发布）。
      # 基线不可用（首次发布 / 历史被改写）时直接跳过：那个 tag 上的台账与本仓历史无关，
      # 拿它比对会得出"前端没变 → 不发版"的错误结论。
      - name: Resolve previous release ledger
        id: prev
        if: needs.resolve-version.outputs.is_release == 'true' && needs.changes.outputs.baseline_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 解析时排除本次自己的 tag（重跑时 tag 已存在，不能被当成"上一版"）。
          TAG="$(bash "$GITHUB_WORKSPACE/scripts/ci/latest-release-tag.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --exclude "${{ needs.resolve-version.outputs.release_tag }}" || true)"
          if [[ -n "$TAG" ]] && ! git merge-base --is-ancestor "$TAG" HEAD; then
            echo "::warning::${TAG} 不是 HEAD 的祖先（历史被改写）→ 不作为台账比对基线"
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上一版 release: ${TAG:-(none)}"
          mkdir -p previous-ledger
          if [[ -n "$TAG" ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'pim-web-version.json' --dir previous-ledger \
              && echo "已取到上一版台账" \
              || echo "上一版 release 没有 pim-web-version.json 资产（按无台账处理）"
          fi
          ls -la previous-ledger || true

      - name: Decide whether to publish
        id: decide
        env:
          IS_RELEASE: ${{ needs.resolve-version.outputs.is_release }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend_changed }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" != "true" ]; then
            # PR / 非 master 运行不发布：不做台账比对（也没有台账可比）。
            {
              echo "publish=true"
              echo "dedupe_reason=非发版运行（is_release=false），不做防重复发版判定"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci/release-dedupe.sh \
            --web-version "${{ steps.resolve.outputs.web_version }}" \
            --web-git-sha "${{ steps.resolve.outputs.web_git_sha }}" \
            --backend-changed "$BACKEND_CHANGED" \
            --previous-release-tag "${{ steps.prev.outputs.tag }}" \
            --ledger previous-ledger/pim-web-version.json

      - name: Write web dist summary
        if: always()
        env:
          PUBLISH: ${{ steps.decide.outputs.publish }}
          REASON: ${{ steps.decide.outputs.dedupe_reason }}
        run: |
          {
            echo "### 本次内嵌的前端（冻结值，REQ-3）"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 产物镜像 | \`${{ steps.resolve.outputs.web_dist_image }}:${{ steps.resolve.outputs.web_dist_ref }}\` |"
            echo "| digest | \`${{ steps.resolve.outputs.web_dist_digest }}\` |"
            echo "| 前端版本 | \`${{ steps.resolve.outputs.web_version }}\` |"
            echo "| 前端 git sha | \`${{ steps.resolve.outputs.web_git_sha }}\` |"
            echo "| 构建时间(UTC) | \`${{ steps.resolve.outputs.web_built_at }}\` |"
            echo ""
            echo "是否发版：**${PUBLISH:-<未判定>}** —— ${REASON:-<无>}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 契约缺口审计（contract-gap-audit）
  #
  # 回答的是「只看契约，客户端开发者够不够用」，与下列既有门禁**互补**：
  #   * contract-notify / 客户端三仓的 contract-freshness：契约与代码是否同步；
  #   * 本 job：契约本身对客户端是否可读、可解、可生成（描述/枚举/默认值/错误语义/请求体/响应头…）。
  #
  # 为什么进 CI Gate：契约是对外承诺。会让客户端「猜错或写不出来」的缺口（P1）
  # 和「端点被悄悄删除」（P0）不应在合入时才被发现。历史缺口按类别登记在
  # docs/contract-baseline.json 的 approvedGaps 里（不阻塞），**新出现的**类别默认失败。
  #
  # 触发面与其它门禁一致：push / pull_request / workflow_dispatch 全部真实执行，没有 if 跳过。
  # 离线：只用 python 3 标准库；行为测试见 scripts/ci/test-contract-gap-audit.sh、
  # test-extract-business-error-codes.sh、test-contract-gap-gate.sh。
  # ---------------------------------------------------------------------------
  contract-gap-audit:
    name: Contract gap audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Behavior tests (offline)
        run: |
          bash scripts/ci/test-contract-gap-audit.sh
          bash scripts/ci/test-extract-business-error-codes.sh
          bash scripts/ci/test-contract-gap-gate.sh

      - name: Business error codes table is up to date
        # 码表落后于源码 → 红：否则客户端按码分支时会对不上服务端实际返回值。
        run: python scripts/ci/extract-business-error-codes.py --check --audit-config docs/contract-baseline.json

      - name: Audit contract gaps
        run: bash scripts/ci/audit-contract-gaps.sh

  build-api:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/build-api.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-docker:
    needs: [resolve-version, changes, web-dist]
    # 镜像里内嵌前端，因此「后端有变化（api）」「镜像定义有变化（docker）」都要重烘镜像；
    # 另外只有在前端/后端判定为需要发版时才烘（REQ-6：不发版就不得推出新镜像 tag）。
    if: |
      (needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.docker == 'true') &&
      (needs.resolve-version.outputs.is_release != 'true' || needs.web-dist.outputs.publish != 'false')
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
      is_release: ${{ needs.resolve-version.outputs.is_release }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      web_dist_ref: ${{ needs.web-dist.outputs.ref }}
      web_dist_digest: ${{ needs.web-dist.outputs.digest }}

  build-mcp:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/build-mcp.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  # ---------------------------------------------------------------------------
  # 契约变更通知（工单 #415 方案 A：api 侧 repository_dispatch 主动推送）。
  #
  # 三个「为什么」：
  #   * 为什么 needs build-api 且要求 success：通知里带的是"哪个 commit 的契约"，
  #     而"那份契约与代码一致"这件事只有 build-api 的硬校验能证明。没被校验过的
  #     契约不许发给客户端 —— 宁可不发（客户端的新鲜度门禁会继续报红，可见），
  #     也不把一份可能错的契约推给三个仓。build-api 失败时本次不通知；下一条成功
  #     的 master push 仍会检测到同样的差异并补发（检测基线是上一版 release，自愈）。
  #   * 为什么不在 pull_request 上跑：契约的权威版本是 master 上的文件。PR 还没合，
  #     推给客户端就是让它们按一份"可能不会进 master"的契约开 PR。
  #   * 为什么**不**进 CI Gate / 不进 release 的 needs：客户端投递失败不该阻塞
  #     本仓的发版，也不该把本仓的必需检查变红（工单 §7「不阻塞任何一侧」）。
  #     失败是这一条 job 的红色 + summary，另外客户端的新鲜度门禁是第二道网。
  #
  # 凭据：GitHub App（pim-contract-sync，安装范围仅三个客户端仓，
  # 权限 contents:write / pull_requests:write / metadata:read）。用
  # actions/create-github-app-token 现签 1 小时有效的 installation token：
  # 由 action 负责 JWT / 换 token / 换行转义，比手搓 JWT 少一类"写法坑"；
  # token 只经环境变量传给脚本（不进 argv、不落盘、不回显）。
  # ---------------------------------------------------------------------------
  contract-notify:
    name: Notify clients of contract change
    needs: [resolve-version, changes, build-api]
    # 注意这里**不**写 `needs.build-api.result == 'success'`：那样会让 job 被静默跳过
    # （手动补发时 build-api 常因后端无变化而 skipped → "补发"什么都没发生还不报错）。
    # 硬校验门槛放在脚本里，跳过还是失败都会留下明确日志。
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.contract_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create contract-sync app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PIM_CONTRACT_SYNC_APP_ID }}
          private-key: ${{ secrets.PIM_CONTRACT_SYNC_PRIVATE_KEY }}
          # owner/repositories 决定为哪个安装签发 token；三个客户端仓与本源仓同属一个 owner。
          owner: ${{ github.repository_owner }}
          repositories: pim-web,pim-android,pim-windows

      - name: Dispatch contract-updated to client repos
        env:
          # token 只经环境变量传入：不进命令行参数、不落盘（脚本内 curl 用 --config /dev/stdin）。
          CONTRACT_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # --github-ref 必须传：契约的权威版本是 **master 上的文件**，脚本据此把非 master
          # 的运行降级成 dry-run（绝不把一份可能永远不进 master 的契约推给客户端仓）。
          # 这条规则在脚本里而不是 YAML 里，因为它需要能被离线行为测试覆盖。
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_contract_notify || 'false' }}"
          bash scripts/ci/notify-contract-sync.sh \
            --owner "${{ github.repository_owner }}" \
            --build-api-result "${{ needs.build-api.result }}" \
            --force "${FORCE:-false}" \
            --repos "pim-web pim-android pim-windows" \
            --contract-repo "${{ github.repository }}" \
            --source-path contract/openapi.json \
            --event-type contract-updated \
            --contract-commit "${{ needs.changes.outputs.contract_commit }}" \
            --contract-sha256 "${{ needs.changes.outputs.contract_sha256 }}" \
            --contract-bytes "${{ needs.changes.outputs.contract_bytes }}" \
            --github-ref "${{ github.ref }}"

  summarize:
    needs: [resolve-version, changes, web-dist, build-api, build-docker, build-mcp, contract-gap-audit, contract-notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print build summary
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "## ✅ CI Build Summary — v${VERSION}" 
          echo ""
          echo "| Platform | Status |"
          echo "|:---------|:-------|"
          echo "| 🖥️  API     | ${{ needs.build-api.result == 'success' && '✅ Built' || needs.build-api.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🐳  Docker  | ${{ needs.build-docker.result == 'success' && '✅ Built' || needs.build-docker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🤖 MCP | ${{ needs.build-mcp.result == 'success' && '✅ Built' || needs.build-mcp.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo ""
          echo "数组件判定：all=${{ needs.changes.outputs.all }} api=${{ needs.changes.outputs.api }} docker=${{ needs.changes.outputs.docker }} mcp=${{ needs.changes.outputs.mcp }}"
          echo "本次仅重建镜像：${{ needs.changes.outputs.rebuild_image_only }}（开关真接线，见 REQ-5/AC-8）"
          echo "内嵌前端（冻结值）：${{ needs.web-dist.outputs.version }} / ${{ needs.web-dist.outputs.git_sha }}（引用 ${{ needs.web-dist.outputs.ref }}）"
          echo "发版判定：${{ needs.web-dist.outputs.publish }} —— ${{ needs.web-dist.outputs.dedupe_reason }}"
          echo "契约变化检测：changed=${{ needs.changes.outputs.contract_changed }}（sha256=${{ needs.changes.outputs.contract_sha256 }}，${{ needs.changes.outputs.contract_bytes }} 字节）；客户端通知 job：${{ needs.contract-notify.result }}"
          echo ""
          echo "> Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### 组件结果（哪些重建、哪些搬运）"
            echo ""
            echo "| 组件 | 结果 | 判定 |"
            echo "| --- | --- | --- |"
            echo "| build-api | ${{ needs.build-api.result }} | api=${{ needs.changes.outputs.api }} |"
            echo "| build-docker | ${{ needs.build-docker.result }} | docker=${{ needs.changes.outputs.docker }} |"
            echo "| build-mcp | ${{ needs.build-mcp.result }} | mcp=${{ needs.changes.outputs.mcp }} |"
            echo "| contract-gap-audit | ${{ needs.contract-gap-audit.result }} | 契约缺口门禁（离线） |"
            echo "| contract-notify | ${{ needs.contract-notify.result }} | contract_changed=${{ needs.changes.outputs.contract_changed }} |"
            echo ""
            echo "仅重建镜像开关：\`${{ needs.changes.outputs.rebuild_image_only }}\`；本次内嵌前端：\`${{ needs.web-dist.outputs.version }}\` / \`${{ needs.web-dist.outputs.git_sha }}\`；发版：\`${{ needs.web-dist.outputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 汇总门禁：把「子任务失败 / 应跑却未跑」变成整体失败。
  #
  # 为什么需要它：`summarize` 虽然 `if: always()`，但只打印表格，
  # 无论子任务结果如何都返回成功，因此无法作为分支保护的必需检查。
  # 本 job 名称固定（CI Gate）、总在运行，且在下列任一情形失败：
  #   1) 任一必需 job 结果为 failure / cancelled；
  #   2) `changes` 判定某组件「应当重建」，但对应 job 以 skipped 结束（疑似静默漏跑）。
  # 反之，因路径过滤而未变化、按设计被跳过的组件视为正常。
  #
  # 维护提示：本 job 的 `should` 判定必须与各 build-* job 的 `if` 条件保持一致；
  # 修改那些 if 条件（例如新增组件、调整路径过滤）时，请同步更新这里，否则会漏报或误报。
  gate:
    name: CI Gate
    needs: [resolve-version, changes, web-dist, build-api, contract-gap-audit, build-docker, build-mcp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate required jobs
        # 判定逻辑在 scripts/ci/evaluate-gate.sh 里（可被组合测试覆盖，见 test-evaluate-gate.sh）：
        # 只有**显式** publish=false 才把镜像构建的跳过视为"按设计"，空值/异常值一律判红。
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_WEBDIST: ${{ needs.web-dist.result }}
          R_API: ${{ needs.build-api.result }}
          R_DOCKER: ${{ needs.build-docker.result }}
          R_MCP: ${{ needs.build-mcp.result }}
          R_GAP_AUDIT: ${{ needs.contract-gap-audit.result }}
          W_ALL: ${{ needs.changes.outputs.all }}
          W_API: ${{ needs.changes.outputs.api }}
          W_DOCKER: ${{ needs.changes.outputs.docker }}
          W_MCP: ${{ needs.changes.outputs.mcp }}
          IS_RELEASE: ${{ needs.resolve-version.outputs.is_release }}
          W_PUBLISH: ${{ needs.web-dist.outputs.publish }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/evaluate-gate.sh"

  release:
    needs: [resolve-version, summarize, web-dist, build-api, contract-gap-audit, build-docker, build-mcp]
    # Release on every master push where no build failed. Skipped (unchanged)
    # components are fine: their assets are copied from the previous release.
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only changes build nothing - skip the release entirely.
      - name: Decide whether to create a release
        id: decide
        env:
          PUBLISH: ${{ needs.web-dist.outputs.publish }}
          DEDUPE_REASON: ${{ needs.web-dist.outputs.dedupe_reason }}
        run: |
          # 防重复发版（REQ-6）：前端版本与上一版台账一致且后端无变化 → 不发新 release，
          # 也不推新镜像 tag（build-docker 已按 publish=false 跳过）。这里必须显式写明
          # 结论与依据，不能静默跳过。
          if [ "$PUBLISH" = "false" ]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::防重复发版：本次不发版（${DEDUPE_REASON}）"
            {
              echo "### 本次不发版（REQ-6 防重复发版）"
              echo ""
              echo "${DEDUPE_REASON}"
              echo ""
              echo "不产生新 release，不推送新镜像 tag，复用既有产物。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BUILT=0
          for r in "${{ needs.build-api.result }}" \
                    "${{ needs.build-docker.result }}" \
                    "${{ needs.build-mcp.result }}"; do
            if [ "$r" = "success" ]; then BUILT=$((BUILT+1)); fi
          done
          if [ "$BUILT" -gt 0 ]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No component changed; skipping release"
          fi

      - name: Download release artifacts
        if: steps.decide.outputs.do_release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pim-*
          merge-multiple: true
          path: release-assets

      # Previous release, used for asset carry-over AND for the changelog
      # window. Resolved once, by version number, excluding this run's own tag
      # (on a re-run the tag already exists and must not be seen as "previous").
      - name: Resolve previous release tag
        if: steps.decide.outputs.do_release == 'true'
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(bash "$GITHUB_WORKSPACE/scripts/ci/latest-release-tag.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --exclude "${{ needs.resolve-version.outputs.release_tag }}" || true)"
          echo "Previous release: ${TAG:-(none)}"
          if [[ -n "$TAG" ]] && ! git merge-base --is-ancestor "$TAG" HEAD; then
            # Carried-over assets and the changelog window are both defined as
            # "the diff between TAG and this release". When the repository
            # history has been rewritten (e.g. the split into pim-api / pim-web /
            # pim-android / pim-windows), the previous tag no longer belongs to
            # this history: the diff is meaningless and the carry-over would
            # copy assets built on an unrelated base. Fall back to "no previous
            # release" instead - every component is rebuilt in that case, which
            # is exactly what a history-rewriting change requires anyway.
            echo "::warning::$TAG is not an ancestor of HEAD (history rewritten); discarding the previous-release baseline and publishing a full build"
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # For components that were not rebuilt this run, reuse the asset from the
      # previous release as-is (same file name and version number - the artifact
      # version stays consistent with its content).
      - name: Fill missing assets from last release
        if: steps.decide.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          TAG="$PREVIOUS_TAG"
          copy_if_missing() {
            local pattern="$1"
            if ! ls release-assets/${pattern} >/dev/null 2>&1; then
              if [[ -z "$TAG" ]]; then
                echo "::error::No previous release to copy ${pattern} from; run a full build" >&2
                exit 1
              fi
              gh release download "$TAG" --pattern "$pattern" --dir release-assets
            fi
          }
          # Only replace skipped (unchanged) components with last release's
          # assets; any other non-success result is unexpected here and must
          # fail loudly instead of silently publishing a stale asset.
          fill_if_skipped() {
            local result="$1" pattern="$2"
            if [ "$result" = "skipped" ]; then
              copy_if_missing "$pattern"
            elif [ "$result" != "success" ]; then
              echo "::error::Unexpected build result '${result}' for ${pattern}; not replacing with a stale asset" >&2
              exit 1
            fi
          }
          fill_if_skipped "${{ needs.build-api.result }}" 'pim-api-*.tar.gz'
          fill_if_skipped "${{ needs.build-docker.result }}" 'pim-api-server-*.tar.gz'
          fill_if_skipped "${{ needs.build-mcp.result }}" 'pim-mcp-server-*.tar.gz'
          # 台账（REQ-7）：每次 release 都必须有一份。镜像这次没重建时，本次发布里前端
          # 就是上一版镜像里的那份，所以按同一规则从上一版 release 搬运（内容依然真实）。
          fill_if_skipped "${{ needs.build-docker.result }}" 'pim-web-version.json'
          if [ "${{ needs.build-docker.result }}" = "skipped" ]; then
            # 搬来的台账里 apiVersion 是上一版发布的版本号，而它现在描述的是**本次**发布：
            # 必须改写。前端三字段（镜像内事实）不许动——它们与镜像内容一一对应。
            OLD="$(jq -r '.apiVersion' release-assets/pim-web-version.json)"
            NEW="${{ needs.resolve-version.outputs.version }}"
            jq -S --arg v "$NEW" '.apiVersion = $v' release-assets/pim-web-version.json \
              > release-assets/pim-web-version.json.tmp
            mv release-assets/pim-web-version.json.tmp release-assets/pim-web-version.json
            echo "台账来自上一版搬运：apiVersion ${OLD} → ${NEW}（前端三字段与镜像内文件保持逐字一致）"
            cat release-assets/pim-web-version.json
          fi
          # Sanity check: every asset family must be present before uploading.
          for p in pim-api-*.tar.gz pim-api-server-*.tar.gz pim-mcp-server-*.tar.gz pim-web-version.json; do
            ls release-assets/${p} >/dev/null 2>&1 \
              || { echo "::error::Missing release asset family: ${p}" >&2; exit 1; }
          done
          ls -la release-assets/

      - name: Build release notes from merged PRs
        if: steps.decide.outputs.do_release == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same window as the carried-over assets: merged PRs between the
          # previous release and this one.
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          FROM_ARGS=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            FROM_ARGS+=(--from-tag "$PREVIOUS_TAG")
          fi
          NOTES="$(bash scripts/ci/build-release-notes.sh \
            --repo "${{ github.repository }}" \
            --to-tag "${{ needs.resolve-version.outputs.release_tag }}" \
            "${FROM_ARGS[@]}")"

          # REQ-10：release 说明里加一行前端版本，一眼看出前端有没有动。
          # 数据取自本次 release 实际附带的台账（新烘的或从上版搬运的都算），
          # 因此与台账逐字一致；取不到就明说取不到，不猜。
          LEDGER="release-assets/pim-web-version.json"
          if [ -s "$LEDGER" ]; then
            WEB_SHA="$(jq -r '.gitSha' "$LEDGER")"
            WEB_VERSION="$(jq -r '.version' "$LEDGER")"
            WEB_TAG="$(jq -r '.imageTag' "$LEDGER")"
            NOTES="${NOTES}"$'\n\n'"---"$'\n'"内嵌前端 / Embedded web: \`sha-${WEB_SHA}\` (${WEB_VERSION}) — from \`${WEB_TAG}\`"$'\n'
          else
            NOTES="${NOTES}"$'\n\n'"内嵌前端 / Embedded web: 台账缺失（未读到 pim-web-version.json）"$'\n'
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.decide.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          # Pin the tag to the commit this run actually built. Without it the
          # release API creates the tag wherever the default branch points at
          # tag-creation time, so a slower run can end up tagged with a commit
          # it never built (observed: v2026.09.488 was tagged 70f5ec44 while it
          # built 8b7adb6d, which also broke the changelog window).
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.release_tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release-assets/pim-api-*.tar.gz
            release-assets/pim-api-server-*.tar.gz
            release-assets/pim-mcp-server-*.tar.gz
            release-assets/pim-web-version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
