name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      client_patch:
        description: Optional client patch suffix (e.g. android.1)
        required: false
        default: ''
        type: string
      force_all:
        description: Force all platform builds
        required: false
        default: true
        type: boolean

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      is_release: ${{ steps.ver.outputs.is_release }}
      year_month: ${{ steps.ver.outputs.year_month }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      base_version: ${{ steps.ver.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          client_patch: ${{ github.event_name == 'workflow_dispatch' && inputs.client_patch || '' }}
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.flags.outputs.all }}
      api: ${{ steps.flags.outputs.api }}
      web: ${{ steps.flags.outputs.web }}
      windows: ${{ steps.flags.outputs.windows }}
      android: ${{ steps.flags.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/Pim.Api/**'
              - 'src/Pim.Core/**'
              - 'src/Pim.Infrastructure/**'
              - 'src/modules/**'
              - 'tests/Pim.UnitTests/**'
              - 'Pim.sln'
              - 'src/Directory.Build.props'
              - 'scripts/ci/**'
              - '.github/workflows/build-api.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'src/client-web/**'
              - 'branding/**'
              - 'scripts/branding/**'
              - '.github/workflows/build-web.yml'
              - '.github/workflows/ci.yml'
            windows:
              - 'src/client-windows/**'
              - 'src/Directory.Build.props'
              - 'branding/**'
              - '.github/workflows/build-windows.yml'
              - '.github/workflows/ci.yml'
            android:
              - 'src/client-android/**'
              - 'branding/**'
              - '.github/workflows/build-android.yml'
              - '.github/workflows/ci.yml'
            infra:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'

      - id: flags
        shell: bash
        run: |
          # master / workflow_dispatch: always build all
          # PR: path filters; force_all or infra (ci.yml / resolve-version / scripts/ci) => all
          FORCE_ALL="${{ github.event_name == 'workflow_dispatch' && inputs.force_all || false }}"
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "$FORCE_ALL" = "true" ] \
            || [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "windows=${{ steps.filter.outputs.windows }}" >> "$GITHUB_OUTPUT"
            echo "android=${{ steps.filter.outputs.android }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/build-api.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-web:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-windows:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}

  build-android:
    needs: [resolve-version, changes]
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  summarize:
    needs: [resolve-version, changes, build-api, build-web, build-windows, build-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print build summary
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "## ✅ CI Build Summary — v${VERSION}" 
          echo ""
          echo "| Platform | Status |"
          echo "|:---------|:-------|"
          echo "| 🖥️  API     | ${{ needs.build-api.result == 'success' && '✅ Built' || needs.build-api.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🌐  Web     | ${{ needs.build-web.result == 'success' && '✅ Built' || needs.build-web.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 🪟  Windows | ${{ needs.build-windows.result == 'success' && '✅ Built' || needs.build-windows.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo "| 📱  Android | ${{ needs.build-android.result == 'success' && '✅ Built' || needs.build-android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
          echo ""
          echo "> Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release:
    needs: [resolve-version, summarize, build-api, build-web, build-windows, build-android]
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      needs.build-api.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pim-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/pim-api-*.tar.gz
            release-assets/pim-web-*.tar.gz
            release-assets/pim-windows-*.zip
            release-assets/pim-android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
