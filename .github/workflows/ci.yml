name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # 推前端产物镜像到 GHCR 需要它（契约：本仓只多这一项权限，不顺手扩大别的）。
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 业务日口径与开发环境都是 Asia/Shanghai（04:00 起算）；测试里也用 +08:00
# 构造事件，跑在 UTC runner 上会得到不同的本地小时而失败。
env:
  TZ: Asia/Shanghai

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  # 前端本体：lint + 单测 + 门禁自检 + 构建 + 打包。
  # 双壳（Tauri / Capacitor）的打包需要 Windows runner 与 Android SDK，另行接入。
  build-web:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 发布链路新增的脚本先自检（纯逻辑、不依赖网络）：判定/格式错了要在这一步就红。
      - name: Self-test release scripts
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/ci/test-write-web-version.sh
          bash scripts/ci/test-trigger-api-release.sh
          bash scripts/ci/test-check-ghcr-public.sh
          bash scripts/ci/test-dist-tag-state.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # 契约新鲜度（只读，绝不写仓）：把本仓 contract/openapi.json 与 pim-api 当前上游
      # 的字节做逐字节比较，并用仓内锁定的 openapi-typescript 从本仓快照重新生成，
      # 与 client-web/src/api/generated.ts 逐字节比较（覆盖「快照陈旧」与「生成物陈旧」两个方向）。
      # 上游契约一变、本仓没刷新 → 本 job 红；人工执行 scripts/ci/fetch-contract.sh 并提交刷新结果即恢复。
      # 取不到权威源（网络/404/空体/非 OpenAPI3）一律 fail-closed，不跳过、不降级。
      #
      # 说明：为什么沿用 build-web 而不是新建 job —— 该 job 已在 CI Gate 的 needs 里，且本校验
      # 需要 build-web 已 npm ci 出来的 client-web/node_modules（仓内锁定的生成器）；新建 job
      # 会重复 checkout + npm ci 且需要再把它接进 gate.needs（漏接即等于没门禁）。
      - name: Verify client contract is up to date
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-freshness.sh
          echo "✅ 契约快照、provenance 与生成类型均与 pim-api 当前上游一致"

      - name: Build (tsc -b && vite build)
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.resolve-version.outputs.version }}
          VITE_GIT_SHA: ${{ needs.resolve-version.outputs.git_sha_short }}

      # 产物内的前端版本文件（REQ-2 契约）：版本号与 sha 用的是**同一次构建注入的**那两个值
      # （与上面的 VITE_APP_VERSION / VITE_GIT_SHA 同源），不另算一份。
      - name: Write web-version.json into dist
        working-directory: ${{ github.workspace }}
        env:
          PIM_WEB_VERSION: ${{ needs.resolve-version.outputs.version }}
          PIM_WEB_GIT_SHA: ${{ needs.resolve-version.outputs.git_sha_short }}
        run: bash scripts/ci/write-web-version.sh --out client-web/dist/web-version.json

      # 缺文件/字段不一致会让这一步红：产物不许"看起来有版本信息"但其实没有。
      - name: Verify dist payload
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -s client-web/dist/index.html
          test -d client-web/dist/assets
          test -n "$(find client-web/dist/assets -type f -print -quit)"
          test -s client-web/dist/web-version.json
          echo "web-version.json: $(cat client-web/dist/web-version.json)"
          test "$(jq -r .version client-web/dist/web-version.json)" = "${{ needs.resolve-version.outputs.version }}"
          test "$(jq -r .gitSha client-web/dist/web-version.json)" = "${{ needs.resolve-version.outputs.git_sha_short }}"

      # 产物交给 pim-api：pim-api 构建镜像时从本 run 推的产物镜像取用（REQ-1/REQ-3），
      # 不再有"解包到 src/Pim.Api/wwwroot 再 build"的手工路径。
      - name: Package web build
        working-directory: ${{ github.workspace }}
        run: tar -czf pim-web-v${{ needs.resolve-version.outputs.artifact_slug }}.tar.gz -C client-web/dist .

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pim-web-v${{ needs.resolve-version.outputs.artifact_slug }}
          path: pim-web-v${{ needs.resolve-version.outputs.artifact_slug }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  # 汇总门禁：任一子任务失败即整体失败，避免"看起来绿了"。
  gate:
    name: CI Gate
    needs: [resolve-version, build-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_WEB: ${{ needs.build-web.result }}
        run: |
          set -uo pipefail
          fail=0
          check () {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }
          check "resolve-version" "$R_RESOLVE"
          check "build-web" "$R_WEB"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或未产生结果的必需 job。"
            exit 1
          fi
          echo ""
          echo "CI Gate 通过：所有必需 job 均成功。"

  # ---------------------------------------------------------------------------
  # 发布链路（REQ-1 / REQ-4 / REQ-12）——工单里的"形态丙"：
  #
  #   gate1(上面的 gate) → push-dist → trigger-api → release-gate
  #
  # * push-dist 不参与 gate 的 needs（gate 只依赖 resolve-version/build-web），
  #   因此不存在循环依赖；
  # * 「只有 master、且 lint/单测/契约门禁全绿之后才推」由 push-dist 的
  #   `needs: [resolve-version, build-web, gate]` + `if: master` 保证：gate 没过，
  #   push-dist 根本不会运行（needs 失败即 skip，且 gate 自身已经红）；
  # * PR 上 push-dist/trigger-api 按设计跳过，而 gate 不依赖它们，所以 PR 的 CI Gate
  #   不会因"按设计跳过"被误判为红；
  # * 「该跑却没跑」由 release-gate 兜住：master 上 push-dist 或 trigger-api 只要不是
  #   success（包括被 skip），release-gate 就变红 —— 没有静默旁路。
  # ---------------------------------------------------------------------------

  # 把 dist 打成一个只含静态文件的镜像推到 GHCR（契约：包名 pim-web-dist，tag sha-<7> + latest）。
  push-dist:
    name: Push web dist image
    needs: [resolve-version, build-web, gate]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/2746267826/pim-web-dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pim-web-v${{ needs.resolve-version.outputs.artifact_slug }}
          path: artifact

      - name: Unpack the CI artifact (the exact bytes that will be published)
        run: |
          set -euo pipefail
          mkdir -p client-web/dist
          tar -xzf "artifact/pim-web-v${{ needs.resolve-version.outputs.artifact_slug }}.tar.gz" -C client-web/dist
          ls -la client-web/dist | head -20

      - name: Verify the artifact matches this run
        run: |
          set -euo pipefail
          test -s client-web/dist/index.html
          test -d client-web/dist/assets
          test -s client-web/dist/web-version.json
          V="$(jq -r .version client-web/dist/web-version.json)"
          S="$(jq -r .gitSha client-web/dist/web-version.json)"
          test "$V" = "${{ needs.resolve-version.outputs.version }}" \
            || { echo "::error::web-version.json 的 version(${V}) 与本次构建(${{ needs.resolve-version.outputs.version }}) 不一致"; exit 1; }
          test "$S" = "${{ needs.resolve-version.outputs.git_sha_short }}" \
            || { echo "::error::web-version.json 的 gitSha(${S}) 与本次提交(${{ needs.resolve-version.outputs.git_sha_short }}) 不一致"; exit 1; }
          echo "web-version.json 与本次 run 同源：version=${V} gitSha=${S}"
          sha256sum artifact/*.tar.gz || true
          {
            echo "### 产物镜像推送（REQ-1）"
            echo ""
            echo "- 镜像：\`${{ env.IMAGE }}:sha-${{ needs.resolve-version.outputs.git_sha_short }}\` 与 \`:latest\`"
            echo "- 来源产物 tar.gz 的 sha256：\`$(sha256sum artifact/*.tar.gz | cut -d' ' -f1)\`（30 天留存期内可用于与镜像内文件对照）"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 「不可变 tag」必须真的不可变：同一 commit 的重复运行（重跑、重发）不许改字节。
      # 已存在就复用既有产物（正好也是 REQ-6 说的"复用即可"），只把 latest 指到同一个 digest。
      # 存在性判定必须是**权威**的：只有明确"不存在"才允许创建同名 tag，
      # 探测本身失败（网络/鉴权/包不可匿名访问）必须报红 —— 否则会把已存在的
      # 不可变 tag 当成不存在并覆盖掉。
      - name: Check whether the immutable tag already exists
        id: existing
        run: |
          set -euo pipefail
          SHA="${{ needs.resolve-version.outputs.git_sha_short }}"
          # 判定逻辑在 scripts/ci/dist-tag-state.sh 里（可测）：只有**明确不存在**才返回 missing；
          # 探测失败（鉴权/网络/token 服务/凭证助手）一律非 0 退出 → 这里报红，绝不覆盖既有 tag。
          if STATE="$(bash scripts/ci/dist-tag-state.sh "${{ env.IMAGE }}:sha-${SHA}")"; then
            if [ "$STATE" = "exists" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "sha-${SHA} 已存在（登录态下确认）→ 复用既有产物，不覆盖"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "sha-${SHA} 明确不存在 → 本次构建并推送"
            fi
          else
            echo "::error::无法确认 ${{ env.IMAGE }}:sha-${SHA} 是否存在（探测失败），拒绝在不确定的情况下创建/覆盖 tag"
            exit 1
          fi

      - name: Build and push dist image
        id: build
        run: |
          set -euo pipefail
          SHA="${{ needs.resolve-version.outputs.git_sha_short }}"
          VERSION="$(jq -r .version client-web/dist/web-version.json)"

          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            echo "== ${{ env.IMAGE }}:sha-${SHA} 已存在：复用既有产物，不覆盖不可变 tag =="
            docker pull "${{ env.IMAGE }}:sha-${SHA}"
            CID="$(docker create "${{ env.IMAGE }}:sha-${SHA}" /pim-web-dist-reader)"
            docker cp "${CID}:/web-version.json" /tmp/reused-web-version.json
            docker rm -f "$CID" >/dev/null
            REUSED_SHA="$(jq -r .gitSha /tmp/reused-web-version.json)"
            REUSED_VER="$(jq -r .version /tmp/reused-web-version.json)"
            if [ "$REUSED_SHA" != "$SHA" ]; then
              echo "::error::${IMAGE}:sha-${SHA} 里记录的 gitSha 是 ${REUSED_SHA}，与本次提交不一致，拒绝复用"
              exit 1
            fi
            if [ "$REUSED_VER" != "$VERSION" ]; then
              echo "::notice::复用既有产物：镜像里的版本号 ${REUSED_VER} ≠ 本次 run 的 ${VERSION}（同一 commit 的重跑，前端内容相同）"
            fi
            docker tag "${{ env.IMAGE }}:sha-${SHA}" "${{ env.IMAGE }}:latest"
            docker push "${{ env.IMAGE }}:latest"
          else
            docker build \
              -f client-web/Dockerfile.dist \
              --build-arg "PIM_WEB_VERSION=${VERSION}" \
              --build-arg "PIM_WEB_SHA=${SHA}" \
              -t "${{ env.IMAGE }}:sha-${SHA}" \
              -t "${{ env.IMAGE }}:latest" \
              client-web
            docker push "${{ env.IMAGE }}:sha-${SHA}"
            docker push "${{ env.IMAGE }}:latest"
          fi

          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${{ env.IMAGE }}:sha-${SHA}" | head -n1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha-${SHA} 与 latest 均指向 digest=${DIGEST}"

      # 契约要求包必须 public：先探测，未公开就尝试自设，设不了就报红并给出人工指引
      # （不静默失败、不降级为"私有 + 在 pim-api 配凭证"）。
      - name: Ensure the package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if bash scripts/ci/check-ghcr-public.sh "${{ env.IMAGE }}" --expect-tag "sha-${{ needs.resolve-version.outputs.git_sha_short }}"; then
            echo "包已可匿名拉取（public），无需改动"
            exit 0
          fi
          echo "包当前不可匿名拉取，尝试用 GITHUB_TOKEN 设为 public ..."
          if gh api --method PATCH "/user/packages/container/pim-web-dist" -f visibility=public; then
            echo "PATCH 成功，重新探测 ..."
          else
            echo "::error::无法自动把 pim-web-dist 设为 public。请到 GitHub → 头像 → Your packages → pim-web-dist → Package settings → Change visibility 设为 Public 后重跑本 job（AC-10 要求匿名可拉）。"
            exit 1
          fi
          bash scripts/ci/check-ghcr-public.sh "${{ env.IMAGE }}" \
            --expect-tag "sha-${{ needs.resolve-version.outputs.git_sha_short }}" \
            || { echo "::error::设为 public 后仍无法匿名拉取"; exit 1; }

      # 未登录状态下真实拉取一次（这是 AC-10 的硬要求，不是"看起来设过了"）。
      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          SHA="${{ needs.resolve-version.outputs.git_sha_short }}"
          docker logout ghcr.io || true
          docker rmi "${{ env.IMAGE }}:sha-${SHA}" "${{ env.IMAGE }}:latest" || true
          docker pull "${{ env.IMAGE }}:sha-${SHA}"
          docker pull "${{ env.IMAGE }}:latest"
          # 只含静态文件的 scratch 镜像没有 shell：用 create + cp 读内容。
          CID="$(docker create "${{ env.IMAGE }}:sha-${SHA}" /pim-web-dist-reader)"
          docker cp "${CID}:/index.html" /tmp/index.html
          docker cp "${CID}:/web-version.json" /tmp/web-version.json
          docker rm -f "$CID" >/dev/null
          test -s /tmp/index.html
          echo "未登录拉取成功，镜像内 web-version.json: $(cat /tmp/web-version.json)"
          {
            echo ""
            echo "- 匿名（未登录）docker pull 成功；digest=${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # 用 GitHub App 现签的临时 token 触发 pim-api 的 workflow_dispatch（REQ-4）。
  # 失败必须让本 job 变红（脚本会打印 HTTP 状态 + 响应体）。
  trigger-api:
    name: Trigger pim-api release
    needs: [resolve-version, push-dist]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 现签 1 小时有效的安装令牌：不落盘、不久留、不占个人账号。
      # 权限仅 Actions: write + Metadata: read（App 自身权限），安装范围仅 pim-api。
      - name: Create release trigger token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PIM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PIM_RELEASE_APP_PRIVATE_KEY }}
          owner: 2746267826
          repositories: pim-api

      - name: Dispatch pim-api build with this frontend version
        env:
          # token 只经环境变量传入：不进命令行参数、不落盘（脚本内 curl 用 --config /dev/stdin）。
          TRIGGER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # --force-all false 必须显式传：pim-api 的 dispatch 输入 force_all 默认是 true，
          # 不传就会走"强制全量"，防重复发版（REQ-6/AC-4）在自动触发路径上失效。
          bash scripts/ci/trigger-api-release.sh \
            --web-dist-ref "sha-${{ needs.resolve-version.outputs.git_sha_short }}" \
            --rebuild-image-only true \
            --force-all false
          {
            echo "### 已触发 pim-api 发版（REQ-4）"
            echo ""
            echo "- 前端引用：\`sha-${{ needs.resolve-version.outputs.git_sha_short }}\`"
            echo "- 意图：只重建镜像（后端无变化时搬运既有 API/MCP 资产）"
          } >> "$GITHUB_STEP_SUMMARY"

  # 兜底门禁：master 上 push-dist / trigger-api 必须真的跑过且成功。
  # 这挡住"该跑却没跑"（被 skip）的静默旁路 —— PR 上两者按设计跳过，判为正常。
  release-gate:
    name: Release Gate
    needs: [push-dist, trigger-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release jobs
        env:
          R_PUSH: ${{ needs.push-dist.result }}
          R_TRIGGER: ${{ needs.trigger-api.result }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -uo pipefail
          fail=0
          echo "push-dist=${R_PUSH:-<missing>} trigger-api=${R_TRIGGER:-<missing>} on-master=${IS_MASTER}"
          if [ "$IS_MASTER" = "true" ]; then
            for pair in "push-dist:$R_PUSH" "trigger-api:$R_TRIGGER"; do
              label="${pair%%:*}"; result="${pair#*:}"
              if [ "$result" = "success" ]; then
                echo "✅ $label — success"
              else
                echo "❌ $label — ${result:-<missing>}（master 上该跑却没跑，或被跳过；不允许静默旁路）"
                fail=1
              fi
            done
          else
            for pair in "push-dist:$R_PUSH" "trigger-api:$R_TRIGGER"; do
              label="${pair%%:*}"; result="${pair#*:}"
              if [ "$result" = "skipped" ]; then
                echo "⏭️  $label — skipped（非 master，按设计跳过）"
              else
                echo "❌ $label — ${result:-<missing>}（非 master 上本应跳过）"
                fail=1
              fi
            done
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::Release Gate 未通过：发布链路没有按设计完成（见上）。"
            exit 1
          fi
          echo ""
          echo "Release Gate 通过。"
