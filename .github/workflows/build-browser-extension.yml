name: Build Browser Extension

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
      extension_repo:
        required: false
        type: string
        default: '2746267826/tracker-web'
      extension_ref:
        required: false
        type: string
        default: 'master'
      extension_kind:
        required: false
        type: string
        default: 'url'
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''
      extension_repo:
        description: 'Browser extension source repository'
        required: false
        default: '2746267826/tracker-web'
      extension_ref:
        description: 'Browser extension ref (branch or tag)'
        required: false
        default: 'master'
      extension_kind:
        description: 'Extension kind: url (tracker-web) or site (time-tracker fork)'
        required: false
        default: 'url'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version if needed
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      # 浏览器插件源码在独立 fork 仓库，按 dispatch payload / 默认值检出。
      - name: Checkout browser extension source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.extension_repo || '2746267826/tracker-web' }}
          ref: ${{ inputs.extension_ref || 'master' }}
          path: .browser-extension-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 产物目录与依赖安装方式在两个 fork 之间不同（tracker-web: build/ + lockfile；
      # time-tracker-4-browser: dist_prod/ 且上游不提交 lockfile），统一由自适应
      # 脚本处理并做产物校验。
      - name: Install dependencies and build extension
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci/build-browser-extension.mjs \
            --src .browser-extension-src \
            --out artifacts/staging \
            --zip artifacts/pim-browser-extension-v${{ steps.ver.outputs.artifact_slug }}.zip \
            --kind ${{ inputs.extension_kind || 'url' }}

      - name: Verify artifact
        run: |
          ls -lh artifacts/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-browser-extension-v${{ steps.ver.outputs.artifact_slug }}
          path: artifacts/*.zip
          if-no-files-found: error
