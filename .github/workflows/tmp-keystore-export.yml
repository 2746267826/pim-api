name: TEMP keystore export

# ⚠️ 一次性临时工作流：把原仓的安卓签名材料搬到新仓，搬完立即删除。
# 触发方式仅手动；产物保留 1 天；搬运完成后会连同本次运行记录一并清除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystores
        env:
          ANDROID_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SHELL_B64: ${{ secrets.SHELL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -n "${ANDROID_B64:-}" ]; then
            printf '%s' "$ANDROID_B64" | base64 -d > "out/android-release.jks"
          fi
          if [ -n "${SHELL_B64:-}" ]; then
            printf '%s' "$SHELL_B64" | base64 -d > "out/shell-android-release.jks"
          fi
          ls -l out

      - name: Dump alias/password values
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SHELL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHELL_ANDROID_KEYSTORE_PASSWORD }}
          SHELL_ANDROID_KEY_ALIAS: ${{ secrets.SHELL_ANDROID_KEY_ALIAS }}
          SHELL_ANDROID_KEY_PASSWORD: ${{ secrets.SHELL_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "SHELL_ANDROID_KEYSTORE_PASSWORD=$SHELL_ANDROID_KEYSTORE_PASSWORD"
            echo "SHELL_ANDROID_KEY_ALIAS=$SHELL_ANDROID_KEY_ALIAS"
            echo "SHELL_ANDROID_KEY_PASSWORD=$SHELL_ANDROID_KEY_PASSWORD"
          } > out/values.txt
          # 只打印行数，绝不打印内容（公开仓日志）
          echo "values.txt lines: $(wc -l < out/values.txt)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tmp-keystore-move
          path: out/
          retention-days: 1
          if-no-files-found: error
