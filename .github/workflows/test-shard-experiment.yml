name: Test Shard Experiment

# 实验性 workflow：验证把 build-api 的测试拆成多个 shard 是否可行。
# 完全独立于 ci.yml，只在手动触发时运行，不参与 PR 门禁。
#
# 两个模式：
#   filter-only  不起 PG、不做 schema 初始化，只验证「按 filter 切分后总数是否等于全集」
#   full         照搬 build-api 的完整准备（PG + 迁移 + 运行时初始化器）并真跑
on:
  push:
    # 只在实验分支上触发；不写 master，避免影响正常流程
    branches: [xiaoi-linux/test-shard-experiment]
  workflow_dispatch:
    inputs:
      mode:
        description: 'filter-only (快速验证切分) 或 full (带库真跑)'
        required: true
        default: 'filter-only'
        type: choice
        options:
          - filter-only
          - full

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── 基线：不切分，跑全集，用来对照总数与总耗时 ──
  # 慢（21 分钟），默认关闭；需要重新测基线时把 if 改成 inputs.mode == 'filter-only'
  baseline:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64
      - name: Baseline full test (no filter)
        run: |
          set +e
          mkdir -p /tmp/trx
          dotnet test Pim.sln --configuration Release --no-restore \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=baseline.trx" \
            --results-directory /tmp/trx 2>&1 | tee /tmp/baseline.log
          echo "=== 汇总 ==="
          grep -E 'Passed!|Failed!|Total tests|Passed:|Failed:' /tmp/baseline.log | tail -5
          echo "=== TRX 文件 ==="
          ls -la /tmp/trx/ 2>/dev/null
      - name: Upload baseline TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-trx
          path: /tmp/trx/*.trx
          retention-days: 14

  # ── 5 个 shard：按实测耗时切分（Api 拆细，其余合并）──
  shard:
    if: github.event_name == 'push' || inputs.mode == 'filter-only'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # shard-1：单个最慢的类，9.2 分钟，决定整体墙钟下限
          - name: shard-1
            desc: 'Api: PcKeystatsUploadValidationE2ETests（最慢单类）'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PcKeystatsUploadValidationE2ETests'
          # shard-2：Api 慢组 A（三个 ~4 分钟的 E2E 类）
          - name: shard-2
            desc: 'Api: PublicRegistrationGate + AuthPasswordChange + AdminCreateUser'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PublicRegistrationGateE2ETests|FullyQualifiedName~Pim.UnitTests.Api.AuthPasswordChangeE2ETests|FullyQualifiedName~Pim.UnitTests.Api.AdminCreateUserE2ETests'
          # shard-3：Api 慢组 B（四个 3-3.5 分钟的 E2E 类）
          - name: shard-3
            desc: 'Api: PcTrackerEndpoints + FilesProviderErrorSurface + OneDriveContent + TaskChecklistGet'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api.PcTrackerEndpointsE2ETests|FullyQualifiedName~Pim.UnitTests.Api.FilesProviderErrorSurfaceTests|FullyQualifiedName~Pim.UnitTests.Api.OneDriveContentEndpointsE2ETests|FullyQualifiedName~Pim.UnitTests.Api.TaskChecklistGetE2ETests'
          # shard-4：Api 其余（用 NOT 排除已分配的 8 个类）
          - name: shard-4
            desc: 'Api 其余类（排除慢组 1/2/3）'
            filter: 'FullyQualifiedName~Pim.UnitTests.Api&FullyQualifiedName!~PcKeystatsUploadValidationE2ETests&FullyQualifiedName!~PublicRegistrationGateE2ETests&FullyQualifiedName!~AuthPasswordChangeE2ETests&FullyQualifiedName!~AdminCreateUserE2ETests&FullyQualifiedName!~PcTrackerEndpointsE2ETests&FullyQualifiedName!~FilesProviderErrorSurfaceTests&FullyQualifiedName!~OneDriveContentEndpointsE2ETests&FullyQualifiedName!~TaskChecklistGetE2ETests'
          # shard-5：所有非 Api 目录（Harness/Calendar/Notes/Mcp/Services… 合计仅 17 分钟累加）
          - name: shard-5
            desc: '非 Api 全部（Harness + Calendar + Notes + Mcp + Services + …）'
            filter: 'FullyQualifiedName!~Pim.UnitTests.Api'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Pim.sln --runtime linux-x64
      - name: '${{ matrix.name }} — ${{ matrix.desc }}'
        env:
          # matrix.filter 是本文件内硬编码常量，非外部输入，无注入风险
          SHARD_FILTER: ${{ matrix.filter }}
          SHARD_NAME: ${{ matrix.name }}
        run: |
          set +e
          START=$(date +%s)
          dotnet test Pim.sln --configuration Release --no-restore \
            --filter "$SHARD_FILTER" \
            --logger "console;verbosity=minimal" 2>&1 | tee "/tmp/${SHARD_NAME}.log"
          RC=$?
          END=$(date +%s)
          echo "=== ${SHARD_NAME} 耗时: $((END-START)) 秒 ==="
          grep -E 'Passed!|Failed!|Total tests|Passed:|Failed:|Skipped:' "/tmp/${SHARD_NAME}.log" | tail -5
          exit $RC
      - name: 'Upload ${{ matrix.name }} log'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-log-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.log
          retention-days: 7
