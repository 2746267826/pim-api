name: Build Windows Client

on:
  push:
    branches: [master]
    paths:
      - 'src/client-windows/**'
      - 'src/Pim.Core/**'
      - 'src/Pim.Infrastructure/**'
      - 'src/Directory.Build.props'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client-windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Generate version string
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --match "v*" 2>/dev/null || echo "0.0.0")
          DISPLAY=$(echo "$VERSION" | sed 's/^v//' | sed 's/-[0-9]*-g\([0-9a-f]\{7\}\)$/\(\1\)/' | sed 's/-g\([0-9a-f]\{7\}\)$/\(\1\)/')
          echo "value=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "version=$DISPLAY"

      - name: Publish (restore + build + publish in one step)
        run: |
          dotnet publish Pim.Client.App/Pim.Client.App.csproj `
            -c Release `
            -o publish/ `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:GitHash=${{ steps.version.outputs.value }}

      - name: Build and include KeyStats
        shell: pwsh
        run: |
          # Clone KeyStats repo
          git clone --depth 1 https://github.com/2746267826/keyStats.git .keyStats-tmp
          if (-not (Test-Path ".keyStats-tmp/KeyStats.Windows/KeyStats/KeyStats.csproj")) {
            Write-Warning "KeyStats source not found; skipping build"
            Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue
            return
          }

          # Restore NuGet packages and build
          cd .keyStats-tmp/KeyStats.Windows/KeyStats
          dotnet restore -p:TargetFramework=net48
          dotnet build -c Release -p:TargetFramework=net48 --no-restore
          if ($LASTEXITCODE -ne 0) {
            Write-Error "KeyStats build failed"
            exit 1
          }

          # Copy KeyStats.exe and config to publish directory
          # From .keyStats-tmp/KeyStats.Windows/KeyStats/ -> ../../../ = client-windows/ (defaults.working-directory)
          $publishDir = "$pwd/../../../publish"
          Copy-Item "bin/Release/net48/KeyStats.exe" "$publishDir/KeyStats.exe" -Force
          if (Test-Path "bin/Release/net48/KeyStats.exe.config") {
            Copy-Item "bin/Release/net48/KeyStats.exe.config" "$publishDir/KeyStats.exe.config" -Force
          }

          Write-Host "KeyStats built and copied to publish directory"
          cd ../../..
          Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue

      - name: Write version file for reference
        shell: bash
        run: echo "${{ steps.version.outputs.value }}" > publish/VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pim-windows-client
          path: src/client-windows/publish/
          compression-level: 6
