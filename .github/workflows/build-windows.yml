name: Build Windows Client

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client-windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Resolve version if needed
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Windows companion tests
        run: |
          dotnet test ../../tests/Pim.UnitTests/Pim.UnitTests.csproj `
            --configuration Release `
            --filter "FullyQualifiedName~WindowsCompanionShellTests|FullyQualifiedName~WindowsNotificationActionRouterTests|FullyQualifiedName~ApiClientDefaultsTests|FullyQualifiedName~KeyStats|FullyQualifiedName~WindowsStatusCenterTests|FullyQualifiedName~ScheduledTaskService"

      - name: Publish Daemon
        run: |
          dotnet publish Pim.Client.App/Pim.Client.App.csproj `
            -c Release `
            -o publish/ `
            --self-contained false `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -p:Version=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Publish Shell
        run: |
          dotnet publish ../../src/client-shell-windows/Pim.Shell.App/Pim.Shell.App.csproj `
            -c Release `
            -o publish/ `
            --self-contained false `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -p:Version=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Build and include KeyStats
        shell: pwsh
        run: |
          # Clone KeyStats repo
          git clone --depth 1 https://github.com/2746267826/keyStats.git .keyStats-tmp
          if (-not (Test-Path ".keyStats-tmp/KeyStats.Windows/KeyStats/KeyStats.csproj")) {
            Write-Warning "KeyStats source not found; skipping build"
            Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue
            return
          }

          # Restore NuGet packages and build
          cd .keyStats-tmp/KeyStats.Windows/KeyStats
          dotnet restore -p:TargetFramework=net48
          dotnet build -c Release -p:TargetFramework=net48 --no-restore
          if ($LASTEXITCODE -ne 0) {
            Write-Error "KeyStats build failed"
            exit 1
          }

          # Copy KeyStats.exe and ALL dependencies to publish directory
          # From .keyStats-tmp/KeyStats.Windows/KeyStats/ -> ../../../ = client-windows/ (defaults.working-directory)
          $publishDir = "$pwd/../../../publish"
          Get-ChildItem "bin/Release/net48/*" -Include *.exe,*.dll,*.config,*.xml | ForEach-Object {
            Copy-Item $_.FullName "$publishDir/$($_.Name)" -Force
          }
          # Copy locale resource directories (zh-Hans, zh-Hant, etc.)
          Get-ChildItem "bin/Release/net48" -Directory | Where-Object {
            $_.Name -match '^[a-z]{2}(-[A-Za-z0-9]+)?$'
          } | ForEach-Object {
            $locale = $_.Name
            if (Test-Path "$publishDir/$locale") { Remove-Item -Recurse -Force "$publishDir/$locale" }
            Copy-Item -Recurse $_.FullName "$publishDir/$locale" -Force
            Write-Host "✅ Copied locale: $locale"
          }
          Write-Host "KeyStats built and $( (Get-ChildItem bin/Release/net48 -Filter *.dll).Count ) DLLs copied to publish directory"
          cd ../../..
          Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue

      - name: Include KeyStats fix script
        shell: pwsh
        run: |
          $fixScript = Join-Path $env:GITHUB_WORKSPACE "scripts\fix-keystats-session.ps1"
          if (Test-Path $fixScript) {
            Copy-Item -LiteralPath $fixScript -Destination "publish/fix-keystats-session.ps1" -Force
          } else {
            throw "fix-keystats-session.ps1 missing"
          }
          if (-not (Test-Path "publish/fix-keystats-session.ps1")) { throw "fix-keystats-session.ps1 not in publish" }

      - name: Setup Node for browser extension
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pim-watcher-web/package-lock.json

      - name: Build and include Browser Extension
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE/pim-watcher-web"
          npm ci
          if ($LASTEXITCODE -ne 0) { Write-Error "npm ci failed"; exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { Write-Error "browser extension build failed"; exit 1 }
          $dest = "$env:GITHUB_WORKSPACE/src/client-windows/publish/browser-extension"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "dist/*" $dest
          Compress-Archive -Path "$dest/*" -DestinationPath "$env:GITHUB_WORKSPACE/src/client-windows/publish/browser-extension.zip" -Force
          Write-Host "Browser extension packaged to $dest"
          Get-ChildItem $dest | Format-List
          Pop-Location
          $checkDest = "$env:GITHUB_WORKSPACE/src/client-windows/publish/browser-extension"
          if (-not (Test-Path "$checkDest/manifest.json")) { Write-Error "browser extension manifest missing in publish"; exit 1 }
          if (-not (Test-Path "$checkDest/background/main.js")) { Write-Error "browser extension background missing"; exit 1 }

      - name: Write version file for reference
        shell: bash
        run: echo "${{ steps.ver.outputs.version }}" > publish/VERSION

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath pim-windows-v${{ steps.ver.outputs.artifact_slug }}.zip

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not found at $iscc, trying chocolatey install..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Warning "choco exit $LASTEXITCODE" }
            Start-Sleep -Seconds 5
            # Refresh PATH after choco
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          if (-not (Test-Path $iscc)) {
            # Try where.exe
            $where = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
            if ($where) { $iscc = $where }
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after install; checked $iscc"
            Get-ChildItem "C:\Program Files*\Inno Setup*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-List
            exit 1
          }
          Write-Host "Using ISCC: $iscc"
          if (-not (Test-Path "release-assets")) { New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null }
          & $iscc "installer/pim-setup.iss" `
            /DVersion="${{ steps.ver.outputs.version }}" `
            /DArtifactSlug="${{ steps.ver.outputs.artifact_slug }}" `
            /DAssemblyVersion="${{ steps.ver.outputs.assembly_version }}" `
            /O"release-assets"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with $LASTEXITCODE"; exit 1 }
          $exe = Get-ChildItem "release-assets/PIM-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) {
            # fallback: check workspace root (OutputDir=.. case)
            $exe = Get-ChildItem "PIM-Setup-*.exe" | Select-Object -First 1
            if ($exe) {
              if (-not (Test-Path "release-assets")) { New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null }
              Move-Item $exe.FullName "release-assets/$($exe.Name)" -Force
              $exe = Get-Item "release-assets/$($exe.Name)"
            }
          }
          if (-not $exe) { Write-Error "PIM-Setup exe not produced"; Get-ChildItem "release-assets" -ErrorAction SilentlyContinue | Format-List; Get-ChildItem "." -Filter "PIM-Setup-*.exe" | Format-List; exit 1 }
          Write-Host "Installer built: $($exe.FullName) ($($exe.Length) bytes)"
          # also copy to src/client-windows for legacy path compatibility
          Copy-Item $exe.FullName "src/client-windows/$($exe.Name)" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-windows-v${{ steps.ver.outputs.artifact_slug }}
          path: src/client-windows/pim-windows-v${{ steps.ver.outputs.artifact_slug }}.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PIM-Setup-v${{ steps.ver.outputs.artifact_slug }}
          path: release-assets/PIM-Setup-v${{ steps.ver.outputs.artifact_slug }}.exe
