name: Build Windows Client

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
      extension_repo:
        required: false
        type: string
        default: '2746267826/tracker-web'
      extension_ref:
        required: false
        type: string
        default: 'master'
      site_extension_repo:
        required: false
        type: string
        default: '2746267826/time-tracker-4-browser'
      site_extension_ref:
        required: false
        type: string
        default: 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''
      extension_repo:
        description: 'Browser extension source repository'
        required: false
        default: '2746267826/tracker-web'
      extension_ref:
        description: 'Browser extension ref (branch or tag)'
        required: false
        default: 'master'
      site_extension_repo:
        description: 'Site-level extension source repository'
        required: false
        default: '2746267826/time-tracker-4-browser'
      site_extension_ref:
        description: 'Site-level extension ref (branch or tag)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client-windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Resolve version if needed
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - name: Windows companion tests
        run: |
          dotnet test ../../tests/Pim.UnitTests/Pim.UnitTests.csproj `
            --configuration Release `
            --filter "FullyQualifiedName~WindowsCompanionShellTests|FullyQualifiedName~WindowsNotificationActionRouterTests|FullyQualifiedName~ApiClientDefaultsTests|FullyQualifiedName~KeyStats|FullyQualifiedName~WindowsStatusCenterTests|FullyQualifiedName~ScheduledTaskService"

      - name: Publish Daemon
        run: |
          dotnet publish Pim.Client.App/Pim.Client.App.csproj `
            -c Release `
            -o publish/ `
            --self-contained false `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -p:Version=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Publish Shell
        run: |
          dotnet publish ../../src/client-shell-windows/Pim.Shell.App/Pim.Shell.App.csproj `
            -c Release `
            -o publish/ `
            --self-contained false `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -p:Version=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Build and include KeyStats
        shell: pwsh
        run: |
          # Clone KeyStats repo
          git clone --depth 1 https://github.com/2746267826/keyStats.git .keyStats-tmp
          if (-not (Test-Path ".keyStats-tmp/KeyStats.Windows/KeyStats/KeyStats.csproj")) {
            Write-Warning "KeyStats source not found; skipping build"
            Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue
            return
          }

          # Restore NuGet packages and build
          cd .keyStats-tmp/KeyStats.Windows/KeyStats
          dotnet restore -p:TargetFramework=net48
          dotnet build -c Release -p:TargetFramework=net48 --no-restore
          if ($LASTEXITCODE -ne 0) {
            Write-Error "KeyStats build failed"
            exit 1
          }

          # Copy KeyStats.exe and ALL dependencies to publish directory
          # From .keyStats-tmp/KeyStats.Windows/KeyStats/ -> ../../../ = client-windows/ (defaults.working-directory)
          $publishDir = "$pwd/../../../publish"
          Get-ChildItem "bin/Release/net48/*" -Include *.exe,*.dll,*.config,*.xml | ForEach-Object {
            Copy-Item $_.FullName "$publishDir/$($_.Name)" -Force
          }
          # Copy locale resource directories (zh-Hans, zh-Hant, etc.)
          Get-ChildItem "bin/Release/net48" -Directory | Where-Object {
            $_.Name -match '^[a-z]{2}(-[A-Za-z0-9]+)?$'
          } | ForEach-Object {
            $locale = $_.Name
            if (Test-Path "$publishDir/$locale") { Remove-Item -Recurse -Force "$publishDir/$locale" }
            Copy-Item -Recurse $_.FullName "$publishDir/$locale" -Force
            Write-Host "✅ Copied locale: $locale"
          }
          Write-Host "KeyStats built and $( (Get-ChildItem bin/Release/net48 -Filter *.dll).Count ) DLLs copied to publish directory"
          cd ../../..
          Remove-Item -Recurse -Force .keyStats-tmp -ErrorAction SilentlyContinue

      - name: Include KeyStats fix script
        shell: pwsh
        run: |
          $fixScript = Join-Path $env:GITHUB_WORKSPACE "scripts\fix-keystats-session.ps1"
          if (Test-Path $fixScript) {
            Copy-Item -LiteralPath $fixScript -Destination "publish/fix-keystats-session.ps1" -Force
          } else {
            throw "fix-keystats-session.ps1 missing"
          }
          if (-not (Test-Path "publish/fix-keystats-session.ps1")) { throw "fix-keystats-session.ps1 not in publish" }

      # URL 级插件（2746267826/tracker-web，PIM Browser Watcher）
      - name: Checkout URL-level extension source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.extension_repo || '2746267826/tracker-web' }}
          ref: ${{ inputs.extension_ref || 'master' }}
          path: .extension-url

      # 站点级插件（2746267826/time-tracker-4-browser，Time Tracker PIM fork）
      - name: Checkout site-level extension source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.site_extension_repo || '2746267826/time-tracker-4-browser' }}
          ref: ${{ inputs.site_extension_ref || 'main' }}
          path: .extension-site

      - name: Setup Node for browser extensions
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 两个 fork 的产物目录与依赖安装方式不同（build/ + lockfile vs
      # dist_prod/ + pure-install），统一交给自适应脚本处理。
      # 每个插件同时产出 Chrome（MV3）与 Firefox（MV2）两份：Firefox 无法运行
      # MV3 service worker 构建，只发 Chrome 版本等于 Firefox 用户没有可用产物（#312）。
      - name: Build URL-level extension (Chrome)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci/build-browser-extension.mjs \
            --src .extension-url \
            --out src/client-windows/publish/browser-extension \
            --zip src/client-windows/publish/browser-extension.zip \
            --kind url \
            --browser chrome

      - name: Build URL-level extension (Firefox)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci/build-browser-extension.mjs \
            --src .extension-url \
            --out src/client-windows/publish/browser-extension-firefox \
            --zip src/client-windows/publish/browser-extension-firefox.zip \
            --kind url \
            --browser firefox

      - name: Build site-level extension (Chrome)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci/build-browser-extension.mjs \
            --src .extension-site \
            --out src/client-windows/publish/browser-extension-site \
            --zip src/client-windows/publish/browser-extension-site.zip \
            --kind site \
            --browser chrome

      - name: Build site-level extension (Firefox)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci/build-browser-extension.mjs \
            --src .extension-site \
            --out src/client-windows/publish/browser-extension-site-firefox \
            --zip src/client-windows/publish/browser-extension-site-firefox.zip \
            --kind site \
            --browser firefox

      # 打包器自身的行为回归（条目名必须是规范 `/`，不得出现 `\`）。
      - name: Test cross-platform packaging scripts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/ci/test-zip-writer.mjs
          node --test scripts/ci/test-verify-extension-zips.mjs
          node --test scripts/ci/test-site-reporter-guard.mjs

      - name: Verify packaged extensions
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          test -f src/client-windows/publish/browser-extension/manifest.json \
            || { echo "URL-level extension manifest missing"; exit 1; }
          test -f src/client-windows/publish/browser-extension/src/background/main.js \
            || { echo "URL-level extension background missing"; exit 1; }
          test -f src/client-windows/publish/browser-extension-site/manifest.json \
            || { echo "site-level extension manifest missing"; exit 1; }
          for f in browser-extension-firefox browser-extension-site-firefox; do
            test -d "src/client-windows/publish/$f" || { echo "$f staging dir missing"; exit 1; }
          done
          # 四个 zip 都要是规范归档、manifest 引用齐全、且目标浏览器与 manifest
          # 版本一致。校验逻辑自带回归测试（test-verify-extension-zips.mjs），
          # 且用 Node 解析而非平台工具，Windows runner 上同样可靠。
          node scripts/ci/verify-extension-zips.mjs \
            src/client-windows/publish/browser-extension.zip:chrome \
            src/client-windows/publish/browser-extension-firefox.zip:firefox \
            src/client-windows/publish/browser-extension-site.zip:chrome \
            src/client-windows/publish/browser-extension-site-firefox.zip:firefox
          echo "All extensions staged for the installer"

      - name: Write version file for reference
        shell: bash
        run: echo "${{ steps.ver.outputs.version }}" > publish/VERSION

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath pim-windows-v${{ steps.ver.outputs.artifact_slug }}.zip

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not found at $iscc, trying chocolatey install..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Warning "choco exit $LASTEXITCODE" }
            Start-Sleep -Seconds 5
            # Refresh PATH after choco
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          if (-not (Test-Path $iscc)) {
            # Try where.exe
            $where = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
            if ($where) { $iscc = $where }
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after install; checked $iscc"
            Get-ChildItem "C:\Program Files*\Inno Setup*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-List
            exit 1
          }
          Write-Host "Using ISCC: $iscc"
          if (-not (Test-Path "release-assets")) { New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null }
          & $iscc "installer/pim-setup.iss" `
            /DVersion="${{ steps.ver.outputs.version }}" `
            /DArtifactSlug="${{ steps.ver.outputs.artifact_slug }}" `
            /DAssemblyVersion="${{ steps.ver.outputs.assembly_version }}" `
            /O"release-assets"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with $LASTEXITCODE"; exit 1 }
          $exe = Get-ChildItem "release-assets/PIM-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) {
            # fallback: check workspace root (OutputDir=.. case)
            $exe = Get-ChildItem "PIM-Setup-*.exe" | Select-Object -First 1
            if ($exe) {
              if (-not (Test-Path "release-assets")) { New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null }
              Move-Item $exe.FullName "release-assets/$($exe.Name)" -Force
              $exe = Get-Item "release-assets/$($exe.Name)"
            }
          }
          if (-not $exe) { Write-Error "PIM-Setup exe not produced"; Get-ChildItem "release-assets" -ErrorAction SilentlyContinue | Format-List; Get-ChildItem "." -Filter "PIM-Setup-*.exe" | Format-List; exit 1 }
          Write-Host "Installer built: $($exe.FullName) ($($exe.Length) bytes)"
          # also copy to src/client-windows for legacy path compatibility
          Copy-Item $exe.FullName "src/client-windows/$($exe.Name)" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pim-windows-v${{ steps.ver.outputs.artifact_slug }}
          path: src/client-windows/pim-windows-v${{ steps.ver.outputs.artifact_slug }}.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PIM-Setup-v${{ steps.ver.outputs.artifact_slug }}
          path: release-assets/PIM-Setup-v${{ steps.ver.outputs.artifact_slug }}.exe
